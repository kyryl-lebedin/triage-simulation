<!doctype html>
<!-- A researcher's visualisation for a chat treatment, in the style of an NHS service: the prompt goes into an
     agent, and the agent's first turns with a patient play out in a chat window. The turns are illustrative,
     written for this visual to show what each block of the prompt makes the agent do. They are not model output.
     It carries a prototype banner and no NHS logo: it is a picture of a treatment, not a live service.
     Stand-in sends the selected version as { standin: { name, type, text } }. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt into agent</title>
<style>
  :root { --blue: #005eb8; --dark: #003087; --text: #212b32; --grey1: #4c6272; --grey4: #d8dde0; --grey5: #f0f4f5; --green: #007f3b; --yellow: #ffeb3b; --aqua: #00a499; --purple: #330072; --warm: #ed8b00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--grey5); color: var(--text); font: 400 16px/1.45 "Frutiger W01", "Frutiger", Arial, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 132px minmax(0, 1.05fr); align-items: stretch; padding: 24px; min-height: 540px; }
  h2 { margin: 0 0 12px; font-size: 19px; font-weight: 600; }
  h2 small { display: block; font-size: 14px; font-weight: 400; color: var(--grey1); }
  /* the prompt, block by block: NHS inset text, one colour per block */
  .prompt { min-width: 0; }
  .block { margin-bottom: 12px; padding: 12px 16px; border-left: 8px solid var(--c); background: #fff; opacity: .3; transition: opacity 300ms, box-shadow 200ms; }
  .block.in { opacity: 1; }
  .block.hot { box-shadow: 0 0 0 4px var(--yellow), 0 0 0 6px var(--text); }
  .block b { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--c); }
  .block p { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* the agent */
  .mid { display: grid; place-items: center; position: relative; }
  .mid::before, .mid::after { content: ""; position: absolute; top: 50%; height: 4px; margin-top: -2px; background: var(--blue); width: 26px; }
  .mid::before { left: 4px; } .mid::after { right: 4px; }
  .agent { display: grid; place-items: center; align-content: center; gap: 2px; width: 84px; height: 84px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 4px 0 var(--dark); }
  .agent svg { width: 30px; height: 30px; }
  .agent.think { animation: pulse 700ms ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); background: var(--dark); } }
  .flow { position: absolute; left: 4px; top: calc(50% - 6px); width: 12px; height: 12px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--text); opacity: 0; }
  .flow.go { animation: flow 600ms ease-in forwards; }
  @keyframes flow { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(26px); } }
  /* the conversation: an NHS service page */
  .chat { display: flex; flex-direction: column; min-width: 0; background: #fff; border: 1px solid var(--grey4); border-bottom-width: 4px; }
  .chat header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--blue); color: #fff; font-size: 19px; font-weight: 600; }
  .chat header span { margin-left: auto; padding: 2px 7px; background: #fff; color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .sub { margin: 0; padding: 8px 16px; border-bottom: 1px solid var(--grey4); font-size: 14px; color: var(--grey1); }
  .turns { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow-y: auto; max-height: 460px; background: var(--grey5); }
  .turn { max-width: 84%; animation: rise 260ms ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .turn p { margin: 0; padding: 10px 14px; font-size: 16px; line-height: 1.4; }
  .turn.a p { background: #fff; border-left: 4px solid var(--c, var(--blue)); box-shadow: 0 1px 0 var(--grey4); }
  .turn.p { align-self: flex-end; } .turn.p p { background: var(--blue); color: #fff; border-radius: 4px 4px 0 4px; }
  .turn small { display: block; margin: 4px 2px 0; font-size: 12px; font-weight: 700; color: var(--c, var(--grey1)); }
  .turn.p small { text-align: right; color: var(--grey1); font-weight: 400; }
  .dots p { display: inline-flex; gap: 5px; align-items: center; min-height: 20px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: dot 900ms infinite; } .dots i:nth-child(2) { animation-delay: 150ms; } .dots i:nth-child(3) { animation-delay: 300ms; }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .end { align-self: stretch; padding: 10px 14px; border-left: 8px solid var(--green); background: #fff; font-size: 14px; }
  .end b { display: block; }
  .reply { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--grey4); }
  .reply i { flex: 1; height: 40px; border: 2px solid var(--grey1); background: #fff; }
  .reply b { display: grid; place-items: center; padding: 0 16px; border-radius: 4px; background: var(--green); color: #fff; font-size: 16px; box-shadow: 0 4px 0 #00401e; }
  footer { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; font-size: 14px; color: var(--grey1); }
  footer button { margin-left: auto; padding: 6px 12px; border: 0; border-radius: 4px; background: var(--grey1); color: #fff; font: inherit; font-weight: 600; font-size: 14px; box-shadow: 0 3px 0 #263139; cursor: pointer; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; gap: 16px; } .mid::before, .mid::after, .flow { display: none; } }
  @media (prefers-reduced-motion: reduce) { .turn, .agent.think, .flow.go { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="prompt"><h2>Instructions given to the agent<small>Each block is a part of the prompt under test</small></h2><div id="blocks"></div></section>
  <div class="mid"><span class="flow" id="flow"></span>
    <div class="agent" id="agent"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="6" y="11" width="22" height="16" rx="4"/><path d="M17 11V6M13 19v2M21 19v2M3 18v4M31 18v4"/><circle cx="17" cy="5" r="1.6" fill="currentColor"/></svg>Agent</div></div>
  <section class="chat">
    <header><strong>111 online chat</strong><span>Prototype</span></header>
    <p class="sub"><strong id="vname"></strong> · what a patient would see</p>
    <div class="turns" id="turns"></div>
    <div class="reply" aria-hidden="true"><i></i><b>Send</b></div>
    <footer>Illustrative turns written for this visual, not model output. Not a live NHS service.<button id="again">Replay</button></footer>
  </section>
</div>
<script>
const $ = id => document.getElementById(id), esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const COL = ['#005eb8', '#330072', '#00a499', '#ed8b00', '#ae2573'];
let run = 0;

/* split the prompt at its headed blocks ("Rules:", "Probing:", ...); what comes before the first heading is the role */
function blocks(text) {
  const out = [{ name: 'Role', lines: [] }];
  text.split('\n').forEach(l => { const m = /^([A-Z][^:\n]{2,40}):\s*$/.exec(l.trim()); if (m) out.push({ name: m[1], lines: [] }); else if (l.trim() || out[out.length - 1].lines.length) out[out.length - 1].lines.push(l); });
  return out.map((b, i) => ({ name: b.name, text: b.lines.join('\n').trim(), c: COL[i % COL.length] })).filter(b => b.text);
}
/* which block makes the agent say a line: the turns follow from what the prompt tells it to do */
function script(text, bs) {
  const has = rx => rx.test(text), of = rx => bs.find(b => rx.test(b.text)) || bs[bs.length - 1];
  const probing = has(/vague|hedged|pins it down|do not accept/i), easy = has(/too small|embarrass|wasting anyone|play their symptoms down/i), rules = of(/one question at a time|plain sentences/i);
  const t = [];
  if (easy) t.push(['a', "Nothing is too small or too embarrassing to mention here, and you are not wasting anyone's time. What has brought you here today?", of(/too small|embarrass/i)]);
  else t.push(['a', 'What has brought you here today?', rules]);
  t.push(['p', "I've had a tight feeling in my chest for a while. It's probably just indigestion."]);
  if (probing) {
    t.push(['a', "Let's leave the cause to one side. What are you actually feeling, and where exactly?", of(/do not accept|name a cause/i)]);
    t.push(['p', "It's like a band round my chest. There's a dull ache down my left arm as well."]);
    if (easy) { t.push(['a', 'You said a band round your chest. Many people play this down. How bad is the band, really?', of(/own words|play their symptoms down/i)]); t.push(['p', 'Honestly, it frightened me. I had to sit down.']); }
    else { t.push(['a', 'How bad is it? What is it stopping you from doing?', of(/pins it down|vague/i)]); t.push(['p', 'A bit. I had to stop carrying the shopping.']); t.push(['a', 'You said "a bit". Could you carry on if you had to?', of(/pins it down|vague/i)]); t.push(['p', 'No. I had to sit down.']); }
    t.push(['a', 'Have you noticed anything else, even if it seems unrelated?', of(/anything else|unrelated/i)]);
    t.push(['p', "I've gone a bit clammy, now you mention it."]);
  } else {
    t.push(['a', 'Do you have chest pain?', rules]);
    t.push(['p', "Not really pain. More of a tightness. It's probably nothing."]);
    t.push(['a', 'Are you short of breath?', rules]);
    t.push(['p', 'A bit.']);
    t.push(['a', 'Do you feel sick or sweaty?', rules]);
    t.push(['p', 'Not really.']);
  }
  t.push(['end', '', of(/\[END\]/)]);
  return t;
}
const wait = ms => new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
async function draw(d) {
  const me = ++run, bs = blocks(d.text || ''), turns = script(d.text || '', bs);
  $('vname').textContent = d.name || 'Chat';
  $('blocks').innerHTML = bs.map(b => `<div class="block" style="--c:${b.c}"><b>${esc(b.name)}</b><p>${esc(b.text)}</p></div>`).join('');
  $('turns').innerHTML = ''; size();
  for (const el of $('blocks').children) {   /* the prompt goes in, one block at a time */
    if (me !== run) return; el.classList.add('in'); $('flow').classList.remove('go'); void $('flow').offsetWidth; $('flow').classList.add('go'); await wait(380);
  }
  for (const [who, text, b] of turns) {
    if (me !== run) return;
    const hot = b && $('blocks').children[bs.indexOf(b)];
    if (who !== 'p') { [...$('blocks').children].forEach(x => x.classList.toggle('hot', x === hot)); $('agent').classList.add('think'); }
    const dots = Object.assign(document.createElement('div'), { className: `turn dots ${who === 'p' ? 'p' : 'a'}`, innerHTML: '<p><i></i><i></i><i></i></p>' });
    $('turns').append(dots); $('turns').scrollTop = 1e6; await wait(who === 'p' ? 650 : 900); dots.remove(); $('agent').classList.remove('think');
    if (me !== run) return;
    const el = document.createElement('div');
    if (who === 'end') { el.className = 'end'; el.innerHTML = '<b>The agent ends the chat</b>What the patient said goes to a separate system, which decides the service.'; }
    else { el.className = 'turn ' + who; if (b) el.style.setProperty('--c', b.c); el.innerHTML = `<p>${esc(text)}</p><small>${who === 'p' ? 'Patient' : 'Because of: ' + esc(b.name)}</small>`; }
    $('turns').append(el); $('turns').scrollTop = 1e6; size(); await wait(who === 'p' ? 500 : 350);
  }
  [...$('blocks').children].forEach(x => x.classList.remove('hot'));
}
function size() { if (parent !== window) parent.postMessage({ standinHeight: document.documentElement.scrollHeight }, '*'); }
let cur = null;
$('again').onclick = () => cur && draw(cur);
addEventListener('message', e => { if (e.data && e.data.standin) { cur = e.data.standin; draw(cur); } });
if (parent !== window) parent.postMessage({ standinReady: true }, '*');
else { cur = { name: 'Sample', text: 'You are an online triage assistant.\n\nRules:\n- Ask one question at a time.\n- When done reply with exactly: [END]' }; draw(cur); }
</script>
</body>
</html>
