<!doctype html>
<!-- A researcher's visualisation for a chat treatment: the prompt goes into an agent, and the agent's first turns
     with a patient play out. The turns are illustrative, written for this visual: they show what each block of the
     prompt makes the agent do. They are not model output.
     Stand-in sends the selected version as { standin: { name, type, text } }. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt into agent</title>
<style>
  :root { --ink: #17140f; --paper: #fffdf7; --ground: #ede7dc; --mustard: #f2b52b; --cobalt: #2b46d6; --leaf: #1f8a5f; --tomato: #e5432a; --muted: #6b655a; --line: 2px solid #17140f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 150px minmax(0, 1.05fr); gap: 0; align-items: stretch; padding: 18px; min-height: 520px; }
  h2 { margin: 0 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  /* the prompt, block by block */
  .prompt { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .block { border: var(--line); border-radius: 6px; background: var(--paper); padding: 9px 11px; opacity: .35; transform: translateX(-6px); transition: opacity 300ms, transform 300ms, box-shadow 200ms; }
  .block.in { opacity: 1; transform: none; }
  .block.hot { box-shadow: 0 0 0 3px var(--c); }
  .block b { display: inline-block; margin-bottom: 4px; padding: 1px 7px; border-radius: 3px; background: var(--c); color: #fff; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .block p { margin: 0; font: 500 11.5px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  /* the agent */
  .mid { display: grid; place-items: center; position: relative; }
  .mid::before, .mid::after { content: ""; position: absolute; top: 50%; height: 2px; background: var(--ink); width: 34px; }
  .mid::before { left: 6px; } .mid::after { right: 6px; }
  .agent { display: grid; place-items: center; gap: 4px; width: 92px; height: 92px; border: var(--line); border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; box-shadow: 4px 4px 0 var(--mustard); }
  .agent svg { width: 34px; height: 34px; margin-bottom: -8px; }
  .agent.think { animation: pulse 700ms ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); box-shadow: 4px 4px 0 var(--tomato); } }
  .flow { position: absolute; left: 6px; top: calc(50% - 5px); width: 10px; height: 10px; border-radius: 50%; background: var(--mustard); border: 2px solid var(--ink); opacity: 0; }
  .flow.go { animation: flow 600ms ease-in forwards; }
  @keyframes flow { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(34px); } }
  /* the conversation */
  .chat { display: flex; flex-direction: column; min-width: 0; border: var(--line); border-radius: 10px; background: var(--paper); overflow: hidden; box-shadow: 4px 4px 0 var(--ink); }
  .chat header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: var(--line); font-weight: 800; font-size: 13px; }
  .chat header i { width: 9px; height: 9px; border-radius: 50%; background: var(--leaf); }
  .chat header span { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--muted); }
  .turns { flex: 1; display: flex; flex-direction: column; gap: 9px; padding: 12px; overflow-y: auto; max-height: 440px; }
  .turn { max-width: 86%; animation: rise 260ms ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .turn p { margin: 0; padding: 8px 11px; border: var(--line); border-radius: 12px; font-size: 13px; line-height: 1.4; font-weight: 500; }
  .turn.a p { background: var(--ground); border-bottom-left-radius: 2px; }
  .turn.p { align-self: flex-end; } .turn.p p { background: var(--cobalt); color: #fff; border-bottom-right-radius: 2px; }
  .turn small { display: block; margin: 3px 4px 0; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--c, var(--muted)); }
  .turn.p small { text-align: right; color: var(--muted); }
  .dots p { display: inline-flex; gap: 4px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: dot 900ms infinite; } .dots i:nth-child(2) { animation-delay: 150ms; } .dots i:nth-child(3) { animation-delay: 300ms; }
  @keyframes dot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .end { align-self: center; padding: 4px 10px; border: 1.5px dashed var(--ink); border-radius: 4px; font: 700 11px ui-monospace, Menlo, monospace; }
  footer { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: var(--line); font-size: 11px; font-weight: 700; color: var(--muted); }
  footer button { margin-left: auto; padding: 4px 10px; border: var(--line); border-radius: 4px; background: var(--paper); font: inherit; color: var(--ink); cursor: pointer; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; gap: 14px; } .mid::before, .mid::after, .flow { display: none; } }
  @media (prefers-reduced-motion: reduce) { .turn, .agent.think, .flow.go { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="prompt"><h2>The prompt, block by block</h2><div id="blocks" class="prompt"></div></section>
  <div class="mid"><span class="flow" id="flow"></span>
    <div class="agent" id="agent"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="6" y="11" width="22" height="16" rx="4"/><path d="M17 11V6M13 19v2M21 19v2M3 18v4M31 18v4"/><circle cx="17" cy="5" r="1.6" fill="currentColor"/></svg>Agent</div></div>
  <section class="chat">
    <header><i></i><span id="vname" style="margin:0;color:inherit;font-size:13px;font-weight:800"></span><span>agent ↔ patient</span></header>
    <div class="turns" id="turns"></div>
    <footer>Illustrative turns written for this visual, not model output.<button id="again">Replay</button></footer>
  </section>
</div>
<script>
const $ = id => document.getElementById(id), esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const COL = ['#2b46d6', '#e5432a', '#1f8a5f', '#b47d00', '#6b3fa0'];
let run = 0;

/* split the prompt at its headed blocks ("Rules:", "Probing:", ...); what comes before the first heading is the role */
function blocks(text) {
  const out = [{ name: 'Role', lines: [] }];
  text.split('\n').forEach(l => { const m = /^([A-Z][^:\n]{2,40}):\s*$/.exec(l.trim()); if (m) out.push({ name: m[1], lines: [] }); else if (l.trim() || out[out.length - 1].lines.length) out[out.length - 1].lines.push(l); });
  return out.map((b, i) => ({ name: b.name, text: b.lines.join('\n').trim(), c: COL[i % COL.length] })).filter(b => b.text);
}
/* which block makes the agent say a line: the turns follow from what the prompt tells it to do */
function script(text, bs) {
  const has = rx => rx.test(text), of = rx => bs.find(b => rx.test(b.text)) || bs[bs.length - 1];
  const probing = has(/vague|hedged|pins it down|do not accept/i), easy = has(/too small|embarrass|wasting anyone|play their symptoms down/i), rules = of(/one question at a time|plain sentences/i);
  const t = [];
  if (easy) t.push(['a', "Nothing is too small or too embarrassing to mention here, and you are not wasting anyone's time. What has brought you here today?", of(/too small|embarrass/i)]);
  else t.push(['a', 'What has brought you here today?', rules]);
  t.push(['p', "I've had a tight feeling in my chest for a while. It's probably just indigestion."]);
  if (probing) {
    t.push(['a', "Let's leave the cause to one side. What are you actually feeling, and where exactly?", of(/do not accept|name a cause/i)]);
    t.push(['p', "It's like a band round my chest. There's a dull ache down my left arm as well."]);
    if (easy) { t.push(['a', 'You said a band round your chest. Many people play this down. How bad is the band, really?', of(/own words|play their symptoms down/i)]); t.push(['p', 'Honestly, it frightened me. I had to sit down.']); }
    else { t.push(['a', 'How bad is it? What is it stopping you from doing?', of(/pins it down|vague/i)]); t.push(['p', 'A bit. I had to stop carrying the shopping.']); t.push(['a', 'You said "a bit". Could you carry on if you had to?', of(/pins it down|vague/i)]); t.push(['p', 'No. I had to sit down.']); }
    t.push(['a', 'Have you noticed anything else, even if it seems unrelated?', of(/anything else|unrelated/i)]);
    t.push(['p', "I've gone a bit clammy, now you mention it."]);
  } else {
    t.push(['a', 'Do you have chest pain?', rules]);
    t.push(['p', "Not really pain. More of a tightness. It's probably nothing."]);
    t.push(['a', 'Are you short of breath?', rules]);
    t.push(['p', 'A bit.']);
    t.push(['a', 'Do you feel sick or sweaty?', rules]);
    t.push(['p', 'Not really.']);
  }
  t.push(['end', '[END]  the record goes to the judge', of(/\[END\]/)]);
  return t;
}
const wait = ms => new Promise(r => setTimeout(r, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms));
async function draw(d) {
  const me = ++run, bs = blocks(d.text || ''), turns = script(d.text || '', bs);
  $('vname').textContent = d.name || 'Chat';
  $('blocks').innerHTML = bs.map((b, i) => `<div class="block" style="--c:${b.c}" data-i="${i}"><b>${esc(b.name)}</b><p>${esc(b.text)}</p></div>`).join('');
  $('turns').innerHTML = ''; size();
  for (const el of $('blocks').children) {   /* the prompt goes in, one block at a time */
    if (me !== run) return; el.classList.add('in'); $('flow').classList.remove('go'); void $('flow').offsetWidth; $('flow').classList.add('go'); await wait(380);
  }
  for (const [who, text, b] of turns) {
    if (me !== run) return;
    const hot = b && $('blocks').children[bs.indexOf(b)];
    if (who !== 'p') { [...$('blocks').children].forEach(x => x.classList.toggle('hot', x === hot)); $('agent').classList.add('think'); }
    const dots = Object.assign(document.createElement('div'), { className: `turn dots ${who === 'p' ? 'p' : 'a'}`, innerHTML: '<p><i></i><i></i><i></i></p>' });
    $('turns').append(dots); $('turns').scrollTop = 1e6; await wait(who === 'p' ? 650 : 900); dots.remove(); $('agent').classList.remove('think');
    if (me !== run) return;
    const el = document.createElement('div');
    if (who === 'end') { el.className = 'end'; el.textContent = text; }
    else { el.className = 'turn ' + who; if (b) el.style.setProperty('--c', b.c); el.innerHTML = `<p>${esc(text)}</p><small>${who === 'p' ? 'Patient' : 'Agent · from ' + esc(b.name)}</small>`; }
    $('turns').append(el); $('turns').scrollTop = 1e6; size(); await wait(who === 'p' ? 500 : 350);
  }
  [...$('blocks').children].forEach(x => x.classList.remove('hot'));
}
function size() { if (parent !== window) parent.postMessage({ standinHeight: document.documentElement.scrollHeight }, '*'); }
let cur = null;
$('again').onclick = () => cur && draw(cur);
addEventListener('message', e => { if (e.data && e.data.standin) { cur = e.data.standin; draw(cur); } });
if (parent !== window) parent.postMessage({ standinReady: true }, '*');
else { cur = { name: 'Sample', text: 'You are an online triage assistant.\n\nRules:\n- Ask one question at a time.\n- When done reply with exactly: [END]' }; draw(cur); }
</script>
</body>
</html>
