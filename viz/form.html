<!doctype html>
<!-- A researcher's visualisation for a form treatment: the plain-text form drawn as the online form a patient
     would fill in, in the style of an NHS service (colours, type, radios, buttons of the NHS design system).
     It carries a prototype banner and no NHS logo: it is a picture of a treatment, not a live service.
     It reads the text as written: "1. HEADING" starts a step, "[ ] x" is a tick box, "( ) x" a choice,
     a line with three dashes each side names the questions shown only for that main symptom, "Q1. ..." is a question,
     "[free text]" a text box. Nothing typed here is saved or sent.
     Stand-in sends the selected version as { standin: { name, type, text } }. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form</title>
<style>
  :root { --blue: #005eb8; --dark: #003087; --text: #212b32; --grey1: #4c6272; --grey4: #d8dde0; --grey5: #f0f4f5; --green: #007f3b; --green-d: #00401e; --yellow: #ffeb3b; --link: #005eb8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--grey5); color: var(--text); font: 400 19px/1.47 "Frutiger W01", "Frutiger", Arial, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .head { background: var(--blue); color: #fff; }
  .head div { display: flex; align-items: center; gap: 16px; max-width: 960px; margin: 0 auto; padding: 16px 32px; }
  .head strong { font-size: 22px; font-weight: 600; }
  .head span { margin-left: auto; padding: 3px 8px; background: #fff; color: var(--blue); font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .phase { background: #fff; border-bottom: 1px solid var(--grey4); }
  .phase p { max-width: 960px; margin: 0 auto; padding: 10px 32px; font-size: 16px; color: var(--grey1); }
  .phase b { display: inline-block; margin-right: 8px; padding: 1px 8px; background: var(--dark); color: #fff; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 32px 48px; }
  .col { max-width: 640px; }
  h1 { margin: 0 0 20px; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; }
  .inset { margin: 0 0 32px; padding: 14px 20px; border-left: 8px solid var(--blue); background: #fff; }
  .progress { margin: 0 0 6px; color: var(--grey1); font-size: 16px; }
  section { margin: 0 0 40px; padding: 28px 32px 8px; background: #fff; border: 1px solid var(--grey4); border-bottom-width: 4px; }
  section > h2 { margin: 0 0 16px; font-size: 28px; line-height: 1.2; font-weight: 600; }
  .hint { margin: 0 0 16px; color: var(--grey1); }
  fieldset { margin: 0 0 30px; padding: 0; border: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: 12px; font-size: 22px; line-height: 1.3; font-weight: 600; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opts.row { flex-direction: row; flex-wrap: wrap; gap: 10px 28px; }
  label.opt { position: relative; display: flex; align-items: flex-start; min-height: 40px; padding-left: 52px; cursor: pointer; }
  label.opt input { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: 0; opacity: 0; cursor: pointer; }
  label.opt span { padding-top: 6px; }
  label.opt span::before { content: ""; position: absolute; left: 0; top: 0; width: 40px; height: 40px; border: 2px solid var(--grey1); background: #fff; }
  label.opt input[type=radio] + span::before { border-radius: 50%; }
  label.opt input[type=radio]:checked + span::after { content: ""; position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); }
  label.opt input[type=checkbox]:checked + span::after { content: ""; position: absolute; left: 11px; top: 12px; width: 18px; height: 9px; border: solid var(--text); border-width: 0 0 4px 4px; transform: rotate(-45deg); }
  label.opt input:focus-visible + span::before { border: 4px solid var(--text); box-shadow: 0 0 0 4px var(--yellow); }
  .or { margin: 4px 0; color: var(--grey1); font-size: 16px; }
  textarea { display: block; width: 100%; min-height: 120px; padding: 8px; border: 2px solid var(--grey1); border-radius: 0; font: inherit; resize: vertical; }
  textarea:focus { outline: 4px solid var(--yellow); outline-offset: 0; border-color: var(--text); box-shadow: inset 0 0 0 2px var(--text); }
  .module { display: none; } .module.on { display: block; }
  .module h3 { margin: 0 0 20px; padding-bottom: 8px; border-bottom: 1px solid var(--grey4); font-size: 22px; font-weight: 600; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
  .btn { padding: 12px 18px; border: 0; border-radius: 4px; background: var(--green); color: #fff; font: inherit; font-weight: 600; font-size: 19px; line-height: 1.2; box-shadow: 0 4px 0 var(--green-d); cursor: pointer; }
  .btn:hover { background: #00662f; } .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-d); }
  .btn:focus-visible { outline: 4px solid transparent; background: var(--yellow); color: var(--text); box-shadow: 0 4px 0 var(--text); }
  .foot span { color: var(--grey1); font-size: 16px; }
  @media (max-width: 640px) { main, .head div, .phase p { padding-left: 16px; padding-right: 16px; } section { padding: 20px 16px 4px; } h1 { font-size: 32px; } }
</style>
</head>
<body>
<header class="head"><div><strong id="title">111 online</strong><span>Prototype</span></div></header>
<div class="phase"><p><b>Research</b>This is a picture of a form under test. It is not a live NHS service and nothing you enter is saved.</p></div>
<main><div class="col" id="main"></div></main>
<script>
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sentence = s => { const t = s.toLowerCase().replace(/\bnhs\b/g, 'NHS'); return t[0].toUpperCase() + t.slice(1); };
let uid = 0;
function parse(text) {
  const lines = text.replace(/\r/g, '').split('\n'), form = { title: '', intro: [], steps: [] };
  let step = null, mod = null, q = null;
  const home = () => mod || step, last = () => home().items[home().items.length - 1];
  const options = l => [...l.matchAll(/([(\[]) ?[)\]]\s*(.+?)(?=\s{2,}[(\[] ?[)\]]|$)/g)].map(m => ({ kind: m[1] === '[' ? 'checkbox' : 'radio', label: m[2].trim() }));
  for (const raw of lines) {
    const l = raw.trim(); let m;
    if (!l) { if (q && q.opts.length) q = null; continue; }
    if (!form.title) { form.title = l; continue; }
    if ((m = /^(\d+)\.\s+([A-Z][A-Z ,'&\/-]+)$/.exec(l))) { step = { n: m[1], name: sentence(m[2]), items: [], mods: [] }; form.steps.push(step); mod = q = null; continue; }
    if (!step) { form.intro.push(l); continue; }
    if ((m = /^-{3}\s*(.+?)\s*-{3}$/.exec(l))) { mod = { name: m[1], items: [] }; step.mods.push(mod); q = null; continue; }
    if ((m = /^Q(\d+)\.\s*(.+)$/.exec(l))) { q = { n: m[1], text: m[2], opts: [] }; home().items.push(q); continue; }
    if (/^\[free text\]$/i.test(l)) { const prev = last(); home().items.push({ free: true, text: prev && (prev.hint || (prev.opts && !prev.opts.length)) ? (home().items.pop(), prev.hint || prev.text) : 'Tell us in your own words' }); q = null; continue; }
    if (/^[(\[] ?[)\]]/.test(l)) {
      if (!q) { const prev = last(); q = { n: '', text: prev && prev.hint ? (home().items.pop(), prev.hint) : '', opts: [] }; home().items.push(q); }
      q.opts.push(...options(l)); continue;
    }
    q = null; home().items.push({ hint: l });
  }
  return form;
}
function question(x) {
  const name = 'q' + uid++;
  if (x.hint) return `<p class="hint">${esc(x.hint)}</p>`;
  if (x.free) return `<fieldset><legend>${esc(x.text)}</legend><textarea aria-label="${esc(x.text)}"></textarea></fieldset>`;
  const kind = x.opts[0] ? x.opts[0].kind : 'radio', short = x.opts.every(o => o.label.length <= 12) && x.opts.length <= 4;
  const opts = x.opts.map(o => `<label class="opt"><input type="${kind}" name="${name}"><span>${esc(o.label)}</span></label>`).join('');
  const ns = kind === 'radio' && x.n ? `${short ? '' : '<p class="or">or</p>'}<label class="opt"><input type="radio" name="${name}"><span>Not sure</span></label>` : '';
  return `<fieldset><legend>${esc(x.text)}</legend><div class="opts${short ? ' row' : ''}">${opts}${ns}</div></fieldset>`;
}
function draw(d) {
  uid = 0;
  const f = parse(d.text || ''), title = sentence(f.title || d.name || '111 online check');
  document.getElementById('title').textContent = title.replace(/^NHS /, '');
  document.getElementById('main').innerHTML = `<h1>${esc(title.replace(/^NHS 111 online check$/, 'Check your symptoms'))}</h1>` + (f.intro.length ? `<p class="inset">${esc(f.intro.join(' '))}</p>` : '') + f.steps.map((s, i) =>
    `<p class="progress">Step ${esc(s.n)} of ${f.steps.length}</p><section><h2>${esc(s.name)}</h2>${s.items.map(question).join('')}${s.mods.map((m, k) => `<div class="module${k ? '' : ' on'}" data-name="${esc(m.name)}"><h3>${esc(m.name)}</h3>${m.items.map(question).join('')}</div>`).join('')}</section>`).join('')
    + `<div class="foot"><button class="btn" type="button">Continue</button><span>Nothing you enter here is saved or sent.</span></div>`;
  /* choosing the main symptom shows that symptom's questions, as the form says it does */
  const mods = [...document.querySelectorAll('.module')];
  if (mods.length) document.querySelectorAll('section').forEach(sec => { if (sec.querySelector('.module')) return;
    sec.querySelectorAll('input[type=radio]').forEach((r, i, all) => { if (all.length !== mods.length) return;
      r.addEventListener('change', () => { const lab = r.parentNode.textContent.trim(); const hit = mods.find(m => m.dataset.name === lab) || mods[i]; mods.forEach(m => m.classList.toggle('on', m === hit)); size(); });
      if (i === 0) r.checked = true; }); });
  size();
}
function size() { if (parent !== window) parent.postMessage({ standinHeight: document.documentElement.scrollHeight }, '*'); }
addEventListener('message', e => { if (e.data && e.data.standin) draw(e.data.standin); });
if (parent !== window) parent.postMessage({ standinReady: true }, '*');
else draw({ name: 'Sample', text: 'NHS 111 ONLINE CHECK\n\nYou can skip any question.\n\n1. MAIN SYMPTOM\nSelect one.\n( ) Chest pain\n( ) Back pain\n\n2. QUESTIONS\n--- Chest pain ---\nQ1. How severe?\n    ( ) Mild   ( ) Severe\n--- Back pain ---\nQ1. Since when?\n[free text]' });
</script>
</body>
</html>
