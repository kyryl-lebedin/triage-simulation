<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-in · Tactile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EEE8DA; --paper:#FFFCF4; --ink:#17140F; --muted:#6A6458;
  --tomato:#E5432A; --cobalt:#2346D4; --mustard:#F2B52B; --leaf:#1D8A60; --sky:#A9C8F0; --blush:#F3B7A6;
  --line:2px solid var(--ink); --r:6px; --sh:4px 4px 0 var(--ink);
  --out:cubic-bezier(.23,1,.32,1);
  --font:"Archivo","Arial Narrow",Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.c-cobalt{background:var(--cobalt);color:#fff}.c-tomato{background:var(--tomato);color:#fff}
.c-mustard{background:var(--mustard);color:var(--ink)}.c-leaf{background:var(--leaf);color:#fff}
.c-ink{background:var(--ink);color:var(--paper)}.c-sky{background:var(--sky);color:var(--ink)}
.c-blush{background:var(--blush);color:var(--ink)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;height:64px;padding:0 28px;background:var(--paper);border-bottom:var(--line)}
.brand{font-weight:900;font-stretch:125%;font-size:17px;letter-spacing:.02em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:7px 11px;border-radius:4px;white-space:nowrap}
.stages{display:flex;align-items:center;gap:6px;margin:0 auto}
.stage{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 7px;border:var(--line);border-radius:var(--r);background:transparent;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;transition:transform 120ms var(--out)}
.stage b{display:grid;place-items:center;width:24px;height:24px;border-radius:4px;border:var(--line);font-size:12px;font-weight:800;background:var(--paper)}
.stage.done{background:var(--paper)}
.stage.done b{background:var(--leaf);color:#fff}
.stage.now{background:var(--ink);color:var(--paper)}
.stage.now b{background:var(--mustard);color:var(--ink);border-color:var(--mustard)}
.stage:active{transform:scale(.97)}
.stage-gap{width:14px;height:2px;background:var(--ink)}
.stage-gap.wide{width:26px}
.top-name{font-size:13px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* page */
.page{max-width:1240px;margin:0 auto;padding:44px 32px 120px}
.page>*{animation:rise 240ms var(--out) both}
.page>*:nth-child(2){animation-delay:40ms}.page>*:nth-child(3){animation-delay:80ms}
.page>*:nth-child(4){animation-delay:120ms}.page>*:nth-child(n+5){animation-delay:150ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ask{font-size:clamp(44px,5.2vw,68px);line-height:.94;font-weight:900;font-stretch:125%;letter-spacing:-.025em;margin:0 0 14px}
.hint{font-size:18px;color:var(--muted);max-width:58ch;margin:0;font-weight:500}
.head{margin-bottom:40px}
.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-stretch:88%;margin:0 0 10px}
.sec{margin-bottom:44px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--ink);transition:transform 110ms var(--out);white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.pri{color:#fff}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.pri{background:var(--tomato);color:#fff}
.btn.blue{background:var(--cobalt);color:#fff}
.btn.flat{box-shadow:none;background:transparent}
.btn.flat:active{transform:scale(.97)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.sm:active{transform:translate(2px,2px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.x{display:grid;place-items:center;width:34px;height:34px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:900;font-size:15px;line-height:1;transition:transform 110ms var(--out)}
.x:active{transform:scale(.92)}
.x:hover{background:var(--ink);color:var(--paper)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:56px;padding-top:24px;border-top:var(--line)}
.foot .btn{min-height:56px;padding:0 24px;font-size:17px}

/* material */
.name-in{width:100%;border:0;border-bottom:4px solid var(--ink);background:transparent;font-weight:900;font-stretch:112%;font-size:38px;letter-spacing:-.015em;padding:4px 0 8px;border-radius:0}
.name-in:focus{outline:0;border-bottom-color:var(--cobalt)}
.slabs{display:flex;flex-direction:column;gap:12px}
.slab{display:grid;grid-template-columns:34px 76px 1fr auto;align-items:stretch;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.slab.over{outline:3px dashed var(--cobalt);outline-offset:3px}
.slab.dragging{opacity:.45}
.grip{display:grid;place-items:center;cursor:grab;border-right:var(--line);background:var(--ground)}
.grip i{display:block;width:10px;height:22px;background:radial-gradient(circle,var(--ink) 1.6px,transparent 1.8px) 0 0/5px 5.5px}
.letter{display:grid;place-items:center;font-weight:900;font-stretch:125%;font-size:44px;border-right:var(--line)}
.slab-body{padding:14px 18px;min-width:0}
.slab-name{width:100%;border:0;background:transparent;font-weight:900;font-size:22px;font-stretch:110%;padding:0;border-bottom:2px solid transparent}
.slab-name:hover{border-bottom-color:#17140f33}
.slab-name:focus{outline:0;border-bottom-color:var(--cobalt)}
.slab-tools{display:flex;align-items:center;gap:6px;padding:0 14px}
.drop{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;border:2px dashed var(--ink);border-radius:var(--r);background:transparent}
.drop.hot{background:var(--mustard)}
.drop strong{font-size:19px;font-weight:900;font-stretch:110%}
.drop p{margin:2px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.drop-btns{display:flex;gap:10px}

/* participants */
.count{display:flex;align-items:center;gap:12px}
.count input{width:150px;height:64px;text-align:center;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:900;font-stretch:125%;font-size:36px;-moz-appearance:textfield}
.count input::-webkit-outer-spin-button,.count input::-webkit-inner-spin-button{-webkit-appearance:none}
.step{width:64px;height:64px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-size:30px;font-weight:900;line-height:1;transition:transform 110ms var(--out)}
.step:active{transform:translate(3px,3px);box-shadow:none}
.count em{font-style:normal;color:var(--muted);font-weight:600;margin-left:6px}
.var{margin-bottom:30px}
.var-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.var-name{border:0;background:transparent;font-weight:900;font-stretch:112%;font-size:24px;padding:0;width:auto;min-width:60px;border-bottom:2px solid transparent;field-sizing:content}
.var-name:hover{border-bottom-color:#17140f33}
.var-name:focus{outline:0;border-bottom-color:var(--cobalt)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:var(--line);border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--paper);white-space:nowrap}
.tag.ai{background:var(--mustard)}
.var-head .sp{flex:1}
.bar{position:relative;display:flex;height:76px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);user-select:none;-webkit-user-select:none}
.bar-in{display:flex;flex:1;min-width:0;border-radius:3px;overflow:hidden}
.bar.fresh .bar-in{animation:grow 280ms var(--out) both;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.seg{display:flex;flex-direction:column;justify-content:center;padding:0 12px;min-width:0;overflow:hidden;white-space:nowrap}
.seg+.seg{border-left:var(--line)}
.seg b{font-weight:900;font-stretch:120%;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.seg span{font-size:12px;font-weight:700;opacity:.9;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.seg.tight{padding:0 4px;align-items:center}.seg.tight span{display:none}.seg.tight b{font-size:15px}
.seg.tiny b{display:none}
.hand{position:absolute;top:-8px;bottom:-8px;width:26px;margin-left:-13px;padding:0;border:0;background:transparent;cursor:ew-resize;touch-action:none;z-index:2}
.hand::before{content:"";position:absolute;left:7px;right:7px;top:0;bottom:0;background:var(--paper);border:var(--line);border-radius:6px;transition:transform 110ms var(--out)}
.hand::after{content:"";position:absolute;left:12px;width:2px;top:50%;height:18px;margin-top:-9px;background:var(--ink)}
.hand:hover::before,.hand.live::before{background:var(--mustard);transform:scaleX(1.25)}
.bar.empty{align-items:center;justify-content:space-between;padding:0 18px;gap:16px;background:repeating-linear-gradient(135deg,transparent 0 9px,#17140f1c 9px 11px),var(--paper)}
.bar.empty p{margin:0;font-weight:800;font-size:17px}
.bar.empty .btns{display:flex;gap:10px}
.bar.wait{align-items:center;padding:0 18px;overflow:hidden;background:var(--paper)}
.bar.wait p{margin:0;font-weight:800;font-size:17px;position:relative;z-index:1}
.bar.wait::before{content:"";position:absolute;inset:0;width:40%;background:var(--mustard);animation:sweep 900ms linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.opt{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 4px 0 8px;border:var(--line);border-radius:var(--r);background:var(--paper)}
.opt i{width:14px;height:14px;border:var(--line);border-radius:3px;flex:none}
.opt input{border:0;background:transparent;font-weight:700;font-size:14px;padding:0;min-width:24px;field-sizing:content}
.opt input:focus{outline:0;box-shadow:0 2px 0 var(--cobalt)}
.opt b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);min-width:30px;text-align:right}
.opt button{border:0;background:transparent;font-weight:900;font-size:13px;width:24px;height:24px;border-radius:4px;color:var(--muted)}
.opt button:hover{background:var(--ink);color:var(--paper)}
.ai-note{margin:10px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.addvar{width:100%;min-height:64px;border:2px dashed var(--ink);border-radius:var(--r);background:transparent;font-weight:900;font-size:18px;font-stretch:110%;transition:transform 110ms var(--out)}
.addvar:hover{background:var(--paper)}.addvar:active{transform:scale(.99)}
.brief{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.strip{min-height:150px;padding:18px 20px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);font-size:19px;line-height:1.75;font-weight:500}
.strip:focus{outline:3px solid var(--cobalt);outline-offset:3px}
.ph{display:inline-block;padding:0 9px;margin:0 2px;border:var(--line);border-radius:4px;background:var(--mustard);font-weight:800;font-size:15px;line-height:1.55;white-space:nowrap;cursor:default}
.ph.bad{background:var(--blush)}
.palette{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.palette span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.palette button{padding:0 10px;height:32px;border:var(--line);border-radius:4px;background:var(--mustard);font-weight:800;font-size:14px;cursor:grab;box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out)}
.palette button:active{transform:translate(2px,2px);box-shadow:none}
.who{border:var(--line);border-radius:var(--r);background:var(--ink);color:var(--paper);padding:18px 20px}
.who-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.who-top strong{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.who p{margin:0;font-size:16px;line-height:1.6}
.who mark{background:transparent;color:var(--mustard);font-weight:800}
.who mark.miss{color:var(--blush);text-decoration:underline wavy}
.who .btn{background:var(--paper);color:var(--ink);box-shadow:none;border-color:var(--paper)}

/* actions */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{position:relative;height:148px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);transition:transform 110ms var(--out)}
.tile.on{background:var(--cobalt);color:#fff;box-shadow:none;transform:translate(4px,4px)}
.tile.main{grid-column:span 2;background:var(--mustard);color:var(--ink)}
.tile-press{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:16px;border:0;background:transparent;text-align:left;border-radius:4px;width:100%}
.tile-press svg{width:34px;height:34px}
.tile-press strong{font-weight:900;font-stretch:110%;font-size:20px;line-height:1.1}
.tile:not(.on):active{transform:translate(4px,4px);box-shadow:none}
.tile .state{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;letter-spacing:.09em;pointer-events:none}
.opt b:empty{display:none}
.opt:has(b:empty){padding-right:8px}
.tile .mk{position:absolute;right:46px;top:8px;height:28px;padding:0 9px;border:2px solid currentColor;border-radius:4px;background:transparent;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tile .mk:hover{background:var(--mustard);color:var(--ink);border-color:var(--ink)}
.tile .rm{position:absolute;right:10px;top:8px;width:28px;height:28px;color:var(--ink)}
.tile .state:has(+.rm){right:48px}
.tile .rm+.mk{right:80px}
.tile.main .state{position:static;display:inline-flex;margin:0}
.maintag{position:absolute;top:14px;right:14px;height:24px;padding:0 9px;display:inline-flex;align-items:center;background:var(--ink);color:var(--paper);border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.tile.add{box-shadow:none;border-style:dashed;background:transparent;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:16px}
.tile.add input{height:44px;padding:0 12px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:700;width:100%}
.tile.add .btn{align-self:flex-start}

/* run */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sumbox{border:var(--line);border-radius:var(--r);background:var(--paper);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sumbox header{display:flex;align-items:center;justify-content:space-between}
.sumbox h3{margin:0;font-weight:900;font-stretch:112%;font-size:22px}
.big{font-weight:900;font-stretch:125%;font-size:54px;line-height:.9;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:700;font-stretch:100%;letter-spacing:0;margin-left:8px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-weight:700;font-size:15px}
.vlist li{display:flex;align-items:center;gap:8px}
.badge{display:inline-grid;place-items:center;width:24px;height:24px;border:var(--line);border-radius:4px;font-weight:900;font-size:13px;flex:none}
.mini{display:flex;height:14px;border:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:60px}
.mini i+i{border-left:1.5px solid var(--ink)}
.mini.none{background:repeating-linear-gradient(135deg,transparent 0 5px,#17140f33 5px 7px)}
.vlist .nm{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{height:26px;display:inline-flex;align-items:center;padding:0 8px;border:var(--line);border-radius:4px;font-size:13px;font-weight:700}
.chips span.m{background:var(--mustard)}
.go{margin-top:28px;display:flex;align-items:center;gap:22px}
.runbtn{min-height:92px;padding:0 40px;border:var(--line);border-radius:var(--r);background:var(--tomato);color:#fff;box-shadow:6px 6px 0 var(--ink);font-weight:900;font-stretch:125%;font-size:34px;letter-spacing:-.01em;transition:transform 120ms var(--out)}
.runbtn:active{transform:translate(6px,6px);box-shadow:none}
.go p{margin:0;color:var(--muted);font-weight:600;max-width:36ch}
.prog{margin-top:28px;border:var(--line);border-radius:var(--r);background:var(--paper);padding:22px 24px;box-shadow:var(--sh)}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.cells{display:grid;grid-template-columns:repeat(25,1fr);gap:5px}
.cells i{aspect-ratio:1;border:var(--line);border-radius:3px}
.cells i.f{animation:pop 180ms var(--out) both}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.tick{margin:16px 0 0;font-weight:700;font-size:15px;min-height:22px}

/* results */
.res-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
.res-head .ask{font-size:clamp(36px,4.2vw,54px);max-width:17ch;margin-bottom:10px}
.res-tools{display:flex;gap:10px;flex:none}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:center;padding:16px 18px;border:var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:22px}
.ctrl .lbl{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:38px;padding:0 13px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out);white-space:nowrap}
.pill:active{transform:translate(2px,2px);box-shadow:none}
.pill[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none;transform:translate(2px,2px)}
.pill .star{color:var(--mustard);margin-right:5px}
.gap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 22px;padding:12px 16px;border:var(--line);border-radius:var(--r);background:var(--mustard);font-weight:700;font-size:15px}
.gap strong{font-weight:900}
.gap .lead{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 4px;background:var(--paper);border:var(--line);border-radius:4px;font-size:13px;font-weight:800}
.cols{display:grid;gap:20px;align-items:start}
.col-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.col-head .badge{width:34px;height:34px;font-size:18px}
.col-head h3{margin:0;font-weight:900;font-stretch:112%;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-head .win{margin-left:auto}
.track{position:relative;display:flex;height:270px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.sub{position:relative;flex:1;min-width:0}
.sub+.sub{border-left:1.5px solid #17140f40}
.lift{position:absolute;inset:0;transition:transform 280ms var(--out)}
.fill{position:absolute;inset:0;border-top:var(--line)}
.num{position:absolute;left:12px;top:10px;font-weight:900;font-stretch:125%;font-size:60px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num small{font-size:.42em;letter-spacing:0;margin-left:2px}
.lift[data-light] .num{color:#fff}
.lift.low .num{top:auto;bottom:calc(100% + 8px);color:var(--ink)}
.track.split .num{font-size:19px;left:0;right:0;text-align:center;letter-spacing:-.01em}
.track.split .num small{display:none}
.optrow{display:flex;margin-top:7px}
.optrow span{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cap{margin:7px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.spread{margin-top:20px;border:var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 40px;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border:0;border-bottom:1.5px solid #17140f22;background:transparent;text-align:left;font-size:13px;font-weight:700}
.row:last-child{border-bottom:0}
.row:hover{background:#17140f0d}
.row[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* compact scale: chosen base; overrides the sizes above */
:root{--sh:3px 3px 0 var(--ink);--r:5px}
body{font-size:14px}

.top{height:52px;padding:0 20px;gap:16px}
.brand{font-size:14px;padding:5px 9px}
.stage{height:30px;font-size:13px;padding:0 10px 0 5px;gap:6px}

.page{max-width:1180px;padding:28px 28px 96px}

.x{width:28px;height:28px;font-size:13px}
.foot{margin-top:32px;padding-top:16px}

/* material */
.name-in{font-size:28px;border-bottom-width:3px}

.drop{padding:14px 16px}

/* participants */
.count input{width:110px;height:44px;font-size:24px}
.step{width:44px;height:44px;font-size:22px;box-shadow:2px 2px 0 var(--ink)}
.step:active{transform:translate(2px,2px)}
.var{margin-bottom:20px}
.var-head{margin-bottom:7px}
.var-name{font-size:18px}
.tag{height:20px;font-size:10px}
.bar{height:54px}
.seg{padding:0 9px}
.seg b{font-size:19px}
.seg span{font-size:11px;margin-top:2px}
.seg.tight b{font-size:13px}
.hand{top:-6px;bottom:-6px}

.bar.empty p,.bar.wait p{font-size:14px}
.legend{margin-top:9px;gap:6px}
.opt{height:28px}
.opt input{font-size:13px}
.opt b{font-size:12px}

.brief{gap:16px}

.ph{font-size:13px;padding:0 7px}
.palette{margin-top:10px}
.palette button{height:26px;font-size:12px}
.who{padding:12px 14px}
.who p{font-size:14px}

/* actions */
.tiles{grid-template-columns:repeat(5,1fr);gap:10px}
.tile{height:96px}
.tile.on,.tile:not(.on):active{transform:translate(3px,3px)}
.tile-press{padding:11px}
.tile-press svg{width:24px;height:24px}
.tile-press strong{font-size:15px}
.tile .state{top:10px;right:10px;font-size:10px}
.tile .mk{height:22px;top:6px;right:38px;padding:0 6px;font-size:10px;border-width:1.5px}
.tile .rm{width:22px;height:22px;top:6px;right:8px}
.tile .state:has(+.rm){right:36px}
.tile .rm+.mk{right:66px}
.maintag{top:10px;right:10px;height:20px;font-size:10px}
.tile.add{height:auto;min-height:96px;padding:10px;gap:8px}
.tile.add input{height:32px;flex:none}

/* run */
.sum{gap:10px}
.sumbox{padding:12px 14px;gap:8px}
.sumbox h3{font-size:17px}
.big{font-size:38px}
.big small{font-size:13px}
.vlist{font-size:13px;gap:4px}
.badge{width:20px;height:20px;font-size:11px}
.mini{height:11px}
.chips span{height:22px;font-size:12px}

.prog{margin-top:18px;padding:14px 16px}
.cells{gap:4px}

.gap{padding:8px 12px;font-size:13px;margin-bottom:14px}

.cols{gap:14px}
.col-head{margin-bottom:7px}
.col-head h3{font-size:18px}

.track{height:170px}
.num{font-size:42px;left:10px;top:8px}

.spread{margin-top:12px}
.row{height:28px;font-size:12px}
.row .rb{height:10px}
.why{margin-top:14px;gap:10px}
.note{padding:11px 12px 10px;border-top-width:6px}
.note h4{font-size:15px}
.note p{font-size:13px;margin-bottom:8px}
.note blockquote{font-size:13px;padding:8px 10px;margin-bottom:8px}

/* home */
a.brand{text-decoration:none;transition:transform 110ms var(--out)}

.hname{display:block;font-weight:900;font-stretch:112%;font-size:18px;line-height:1.14}
.hsub{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.hwin{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hscore{margin-left:auto;font-weight:900;font-stretch:125%;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.hprog{flex:1;min-width:40px;height:11px;border:var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
.hprog i{display:block;height:100%;background:var(--mustard);border-right:var(--line)}
.hpc{font-weight:900;font-variant-numeric:tabular-nums}
.hnext{font-weight:800}
/* home: rows */

/* home: featured */

.hfeat-main{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:18px 20px}

    cta = 'Continue at ' + STAGE[f.stage || 'dataset'];
  }
  return `<button class="hfeat" data-act="open" data-id="${f.id}"><span class="hfeat-main"><span class="hfeat-tags">${stTag(f)}<span>${f.date}</span></span><strong class="hfeat-name">${esc(runName(s))}</strong><span class="hsub">${esc(runSub(s))}</span><span class="hmeta">${counts(s)}</span><span class="btn blue">${cta} →</span></span><span class="hfeat-side">${side}</span></button>
  ${rest.length ? `<section class="hearlier"><span class="lbl">Earlier</span><div class="hrows">${rest.map(rowHtml).join('')}</div></section>` : ''}`;
}
function pgHome() {
  return `<div class="res-head"><div><h1 class="ask">Pick up where you left off</h1><p class="hint">Open a run to jump back to its stage, or start a new one.</p></div><div class="res-tools"><button class="btn pri" data-act="new">+ New scenario</button></div></div>
  ${homeFeatured()}`;
}

/* ---------- render + events ---------- */
const PAGES = { home: pgHome, dataset: pgDataset, profiles: pgProfiles, actions: pgActions, run: pgRun, results: pgResults };
let lastRoute = null;
function render() {
  const r = route(), y = r === lastRoute ? scrollY : 0;
  if (r !== 'run' && runTimer) { clearInterval(runTimer); runTimer = null; }
  const cur = curRun();
  if (cur) { if (r === 'home') cur.s = clone(S); else if (cur.status === 'draft' && r !== 'results') cur.stage = r; }
  $('#app').innerHTML = shell(PAGES[r]());
  if (r === 'profiles') S.vars.forEach(paintVar);
  if (r === 'dataset') refreshDiff();
  if (r === lastRoute) { $$('#page>*').forEach(e => e.style.animation = 'none'); }
  scrollTo(0, y); lastRoute = r;
  if (r === 'run' && autoRun && S.variants.length) { setStatus('running'); startRun(); }
  autoRun = false;
}
addEventListener('hashchange', render);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, V = () => S.vars.find(v => v.id === id);
  if (a === 'new') newRun();
  else if (a === 'open') openRun(id);
  else if (a === 'go') go(b.dataset.to);
  else if (a === 'pick') { pendingSlot = null; $('#file').multiple = true; $('#file').click(); }
  else if (a === 'spick') { pendingSlot = { vid: id, fid: b.dataset.f }; $('#file').multiple = false; $('#file').click(); }
  else if (a === 'sclear') { S.variants.find(v => v.id === id).vals[b.dataset.f] = { text: '', file: '' }; render(); }
  else if (a === 'vadd') { const v = addVariant('New version'); render(); if (v) { const inp = $(`[data-bind="vname"][data-id="${v.id}"]`); inp.focus(); inp.select(); } }
  else if (a === 'fadd') { const f = { id: 'f' + S.nextField++, name: 'New field', type: 'text' }; S.fields.push(f); S.tab = f.id; S.confirm = null; render(); const inp = $(`.fname[data-id="${f.id}"]`); if (inp) { inp.focus(); inp.select(); } }
  else if (a === 'ftype') { fieldOf(id).type = b.dataset.t; render(); }
  else if (a === 'fleft' || a === 'fright') { const i = S.fields.findIndex(f => f.id === id), j = i + (a === 'fleft' ? -1 : 1); if (S.fields[j]) { [S.fields[i], S.fields[j]] = [S.fields[j], S.fields[i]]; render(); } }
  else if (a === 'fdel') { if (anyIn(fieldOf(id))) { S.confirm = id; render(); } else removeField(id); }
  else if (a === 'fdelyes') removeField(id);
  else if (a === 'fdelno') { S.confirm = null; render(); }
  else if (a === 'ftab') { S.tab = id; S.confirm = null; render(); }
  else if (a === 'dropf') { S.dropField = id; render(); }
  else if (a === 'diff') { S.diff = !S.diff; b.setAttribute('aria-pressed', S.diff); refreshDiff(); }
  else if (a === 'vdel') { S.variants = S.variants.filter(v => v.id !== id); render(); }
  else if (a === 'vup' || a === 'vdown') { const i = S.variants.findIndex(v => v.id === id), j = i + (a === 'vup' ? -1 : 1); if (S.variants[j]) { [S.variants[i], S.variants[j]] = [S.variants[j], S.variants[i]]; render(); } }
  else if (a === 'count') { S.count = Math.max(50, Math.min(5000, S.count + +b.dataset.d)); $('#count').value = S.count; refreshWho(); }
  else if (a === 'aifill') aiFill(V());
  else if (a === 'even') { const v = V(); evenSplit(v); v.fresh = true; refreshVar(v); }
  else if (a === 'delvar') { S.vars = S.vars.filter(v => v.id !== id); render(); }
  else if (a === 'addvar') { const n = S.nextVar++, v = { id: 'v' + n, key: 'variable_' + n, name: 'New variable', opts: [{ name: 'Option 1', pct: 50 }, { name: 'Option 2', pct: 50 }] }; S.vars.push(v); render(); const inp = $(`[data-var="${v.id}"] .var-name`); inp.focus(); inp.select(); }
  else if (a === 'addopt') { const v = V(); if (filled(v)) { const big = v.opts.reduce((m, o) => o.pct > m.pct ? o : m), take = Math.max(1, Math.min(10, Math.floor(big.pct / 2))); big.pct -= take; v.opts.push({ name: 'Option ' + (v.opts.length + 1), pct: take }); } else v.opts.push({ name: 'Option ' + (v.opts.length + 1), pct: null }); refreshVar(v); const ins = $$(`[data-var="${v.id}"] .opt input`), last = ins[ins.length - 1]; last.focus(); last.select(); }
  else if (a === 'delopt') { const v = V(), i = +b.dataset.i, gone = v.opts.splice(i, 1)[0]; if (gone.pct != null) v.opts.reduce((m, o) => o.pct > m.pct ? o : m).pct += gone.pct; refreshVar(v); }
  else if (a === 'ph') insertPh(b.dataset.ph);
  else if (a === 'shuffle') { S.seed = 1 + Math.floor(Math.random() * S.count); refreshWho(); }
  else if (a === 'toggle') { const x = S.actions.find(q => q.id === id); if (x.id === S.main) return; x.on = !x.on; render(); }
  else if (a === 'main') { S.main = id; render(); }
  else if (a === 'delact') { S.actions = S.actions.filter(q => q.id !== id); if (S.main === id) S.main = (S.actions.find(q => q.on) || {}).id; render(); }
  else if (a === 'run') { setStatus('running'); startRun(); }
  else if (a === 'metric') { S.metric = id; refreshBoard(); }
  else if (a === 'split') { S.split = id; refreshBoard(); }
  else if (a === 'see') { S.metric = b.dataset.m; S.split = S.vars.some(v => v.id === b.dataset.s) ? b.dataset.s : 'none'; refreshBoard(); $('.ctrl').scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
});
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (t.id === 'strip') { readStrip(); refreshWho(); return; }
  if (!b) return;
  if (b === 'name') { S.name = t.value; $('#topName').textContent = t.value; }
  else if (b === 'slot') { const v = S.variants.find(x => x.id === t.dataset.id), f = fieldOf(t.dataset.f); sv(v, f).text = t.value; t.closest('.slot').classList.toggle('empty', !t.value.trim()); refreshCheck(); refreshDiff(); }
  else if (b === 'fname') { fieldOf(t.dataset.id).name = t.value; $$(`[data-flabel="${t.dataset.id}"]`).forEach(e => e.textContent = t.value); refreshCheck(); }
  else if (b === 'vname') S.variants.find(v => v.id === t.dataset.id).name = t.value;
  else if (b === 'count') { const n = parseInt(t.value, 10); if (n > 0) { S.count = Math.min(5000, n); refreshWho(); } }
  else if (b === 'optname') { const v = S.vars.find(x => x.id === t.dataset.id), o = v.opts[+t.dataset.i]; o.name = t.value; delete o.say; if (filled(v)) paintVar(v); refreshWho(); }
  else if (b === 'varname') S.vars.find(x => x.id === t.dataset.id).name = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file') { if (pendingSlot) readInto(pendingSlot, t.files[0]); else readFiles(t.files); pendingSlot = null; t.value = ''; }
  else if (t.dataset.bind === 'fname') { const f = fieldOf(t.dataset.id); if (f && !f.name.trim()) { f.name = 'Field'; render(); } }
  else if (t.dataset.bind === 'count') { S.count = Math.max(10, Math.min(5000, parseInt(t.value, 10) || 500)); t.value = S.count; refreshWho(); }
  else if (t.dataset.bind === 'varname') {
    const v = S.vars.find(x => x.id === t.dataset.id); if (!v.name.trim()) { v.name = 'Variable'; t.value = v.name; }
    let k = slug(v.name); if (v.id === 'pet' && k === 'owns_a_pet') k = 'pet_status';
    while (k === 'name' || S.vars.some(x => x !== v && x.key === k)) k += '_2';
    if (k !== v.key) { S.prompt = S.prompt.split('{' + v.key + '}').join('{' + k + '}'); v.key = k; $('#strip').innerHTML = tplHtml(); $('#palette').innerHTML = paletteHtml(); refreshWho(); }
  }
});
document.addEventListener('focusout', e => { if (e.target.id === 'strip') { readStrip(); e.target.innerHTML = tplHtml(); } });
document.addEventListener('submit', e => {
  if (e.target.id !== 'addact') return; e.preventDefault();
  const name = $('#newact').value.trim(); if (!name) { $('#newact').focus(); return; }
  S.actions.push({ id: 'x' + S.nextAct++, name, on: true, custom: true }); render(); $('#newact').focus();
});

/* divider drag + keys */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.hand'); if (!h) return;
  const bar = h.parentElement, v = S.vars.find(x => x.id === bar.dataset.bar), i = +h.dataset.hand;
  drag = { v, i, bar, h, before: i ? cum(v, i - 1) : 0 }; h.setPointerCapture(e.pointerId); h.classList.add('live'); e.preventDefault(); h.focus();
});
document.addEventListener('pointermove', e => {
  if (!drag) return; const r = drag.bar.getBoundingClientRect();
  setPair(drag.v, drag.i, (e.clientX - r.left) / r.width * 100 - drag.before);
});
const endDrag = () => { if (drag) { drag.h.classList.remove('live'); drag = null; } };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('.hand'); if (!h) return;
  const d = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key]; if (!d) return;
  e.preventDefault(); e.stopPropagation();
  const v = S.vars.find(x => x.id === h.parentElement.dataset.bar), i = +h.dataset.hand;
  setPair(v, i, v.opts[i].pct + d * (e.shiftKey ? 5 : 1));
}, true);

/* drag placeholders into the strip */
document.addEventListener('dragstart', e => {
  const ph = e.target.closest && e.target.closest('.palette button');
  if (ph) { e.dataTransfer.setData('text/x-ph', ph.dataset.ph); e.dataTransfer.effectAllowed = 'copy'; return; }
  const g = e.target.closest && e.target.closest('.grip');
  if (g) { const sl = g.closest('.slab'); e.dataTransfer.setData('text/x-vid', sl.dataset.vid); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setDragImage(sl, 20, 20); sl.classList.add('dragging'); }
});
document.addEventListener('dragend', () => $$('.slab').forEach(s => s.classList.remove('dragging', 'over')));
document.addEventListener('dragover', e => {
  const types = [...e.dataTransfer.types];
  if (types.includes('text/x-ph') && e.target.closest('#strip')) e.preventDefault();
  else if (types.includes('text/x-vid')) { const sl = e.target.closest('.slab'); $$('.slab').forEach(s => s.classList.toggle('over', s === sl)); if (sl) e.preventDefault(); }
  else if (types.includes('Files') && e.target.closest('#drop')) { e.preventDefault(); $('#drop').classList.add('hot'); }
});
document.addEventListener('dragleave', e => { if (e.target.id === 'drop') e.target.classList.remove('hot'); });
document.addEventListener('drop', e => {
  const ph = e.dataTransfer.getData('text/x-ph'), vid = e.dataTransfer.getData('text/x-vid');
  if (ph && e.target.closest('#strip')) { e.preventDefault(); insertPh(ph, document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null); }
  else if (vid) { const sl = e.target.closest('.slab'); if (!sl) return; e.preventDefault(); const from = S.variants.findIndex(v => v.id === vid), to = S.variants.findIndex(v => v.id === sl.dataset.vid); if (from !== to) { S.variants.splice(to, 0, S.variants.splice(from, 1)[0]); } render(); }
  else if (e.dataTransfer.files.length && e.target.closest('#drop')) { e.preventDefault(); readFiles(e.dataTransfer.files); }
});

if (!location.hash) history.replaceState(null, '', '#/home');
render();
</script>
