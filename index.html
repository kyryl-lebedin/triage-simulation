<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-in · Tactile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EEE8DA; --paper:#FFFCF4; --ink:#17140F; --muted:#6A6458;
  --tomato:#E5432A; --cobalt:#2346D4; --mustard:#F2B52B; --leaf:#1D8A60; --sky:#A9C8F0; --blush:#F3B7A6;
  --line:2px solid var(--ink); --r:6px; --sh:4px 4px 0 var(--ink);
  --out:cubic-bezier(.23,1,.32,1);
  --font:"Archivo","Arial Narrow",Arial,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
.c-cobalt{background:var(--cobalt);color:#fff}.c-tomato{background:var(--tomato);color:#fff}
.c-mustard{background:var(--mustard);color:var(--ink)}.c-leaf{background:var(--leaf);color:#fff}
.c-ink{background:var(--ink);color:var(--paper)}.c-sky{background:var(--sky);color:var(--ink)}
.c-blush{background:var(--blush);color:var(--ink)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;height:64px;padding:0 28px;background:var(--paper);border-bottom:var(--line)}
.brand{font-weight:900;font-stretch:125%;font-size:17px;letter-spacing:.02em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:7px 11px;border-radius:4px;white-space:nowrap}
.stages{display:flex;align-items:center;gap:6px;margin:0 auto}
.stage{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 7px;border:var(--line);border-radius:var(--r);background:transparent;text-decoration:none;color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;transition:transform 120ms var(--out)}
.stage b{display:grid;place-items:center;width:24px;height:24px;border-radius:4px;border:var(--line);font-size:12px;font-weight:800;background:var(--paper)}
.stage.done{background:var(--paper)}
.stage.done b{background:var(--leaf);color:#fff}
.stage.now{background:var(--ink);color:var(--paper)}
.stage.now b{background:var(--mustard);color:var(--ink);border-color:var(--mustard)}
.stage:active{transform:scale(.97)}
.stage-gap{width:14px;height:2px;background:var(--ink)}
.stage-gap.wide{width:26px}
.top-name{font-size:13px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* page */
.page{max-width:1240px;margin:0 auto;padding:44px 32px 120px}
.page>*{animation:rise 240ms var(--out) both}
.page>*:nth-child(2){animation-delay:40ms}.page>*:nth-child(3){animation-delay:80ms}
.page>*:nth-child(4){animation-delay:120ms}.page>*:nth-child(n+5){animation-delay:150ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ask{font-size:clamp(44px,5.2vw,68px);line-height:.94;font-weight:900;font-stretch:125%;letter-spacing:-.025em;margin:0 0 14px}
.hint{font-size:18px;color:var(--muted);max-width:58ch;margin:0;font-weight:500}
.head{margin-bottom:40px}
.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-stretch:88%;margin:0 0 10px}
.sec{margin-bottom:44px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:15px;box-shadow:3px 3px 0 var(--ink);transition:transform 110ms var(--out);white-space:nowrap}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.pri{color:#fff}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.pri{background:var(--tomato);color:#fff}
.btn.blue{background:var(--cobalt);color:#fff}
.btn.flat{box-shadow:none;background:transparent}
.btn.flat:active{transform:scale(.97)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn.sm:active{transform:translate(2px,2px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.x{display:grid;place-items:center;width:34px;height:34px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:900;font-size:15px;line-height:1;transition:transform 110ms var(--out)}
.x:active{transform:scale(.92)}
.x:hover{background:var(--ink);color:var(--paper)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:56px;padding-top:24px;border-top:var(--line)}
.foot .btn{min-height:56px;padding:0 24px;font-size:17px}

/* material */
.name-in{width:100%;border:0;border-bottom:4px solid var(--ink);background:transparent;font-weight:900;font-stretch:112%;font-size:38px;letter-spacing:-.015em;padding:4px 0 8px;border-radius:0}
.name-in:focus{outline:0;border-bottom-color:var(--cobalt)}
.slabs{display:flex;flex-direction:column;gap:12px}
.slab{display:grid;grid-template-columns:34px 76px 1fr auto;align-items:stretch;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.slab.over{outline:3px dashed var(--cobalt);outline-offset:3px}
.slab.dragging{opacity:.45}
.grip{display:grid;place-items:center;cursor:grab;border-right:var(--line);background:var(--ground)}
.grip i{display:block;width:10px;height:22px;background:radial-gradient(circle,var(--ink) 1.6px,transparent 1.8px) 0 0/5px 5.5px}
.letter{display:grid;place-items:center;font-weight:900;font-stretch:125%;font-size:44px;border-right:var(--line)}
.slab-body{padding:14px 18px;min-width:0}
.slab-name{width:100%;border:0;background:transparent;font-weight:900;font-size:22px;font-stretch:110%;padding:0;border-bottom:2px solid transparent}
.slab-name:hover{border-bottom-color:#17140f33}
.slab-name:focus{outline:0;border-bottom-color:var(--cobalt)}
.slab-tools{display:flex;align-items:center;gap:6px;padding:0 14px}
.drop{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 24px;border:2px dashed var(--ink);border-radius:var(--r);background:transparent}
.drop.hot{background:var(--mustard)}
.drop strong{font-size:19px;font-weight:900;font-stretch:110%}
.drop p{margin:2px 0 0;color:var(--muted);font-size:14px;font-weight:500}
.drop-btns{display:flex;gap:10px}

/* participants */
.count{display:flex;align-items:center;gap:12px}
.count input{width:150px;height:64px;text-align:center;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:900;font-stretch:125%;font-size:36px;-moz-appearance:textfield}
.count input::-webkit-outer-spin-button,.count input::-webkit-inner-spin-button{-webkit-appearance:none}
.step{width:64px;height:64px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-size:30px;font-weight:900;line-height:1;transition:transform 110ms var(--out)}
.step:active{transform:translate(3px,3px);box-shadow:none}
.count em{font-style:normal;color:var(--muted);font-weight:600;margin-left:6px}
.var{margin-bottom:30px}
.var-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.var-name{border:0;background:transparent;font-weight:900;font-stretch:112%;font-size:24px;padding:0;width:auto;min-width:60px;border-bottom:2px solid transparent;field-sizing:content}
.var-name:hover{border-bottom-color:#17140f33}
.var-name:focus{outline:0;border-bottom-color:var(--cobalt)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border:var(--line);border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--paper);white-space:nowrap}
.tag.ai{background:var(--mustard)}
.var-head .sp{flex:1}
.bar{position:relative;display:flex;height:76px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);user-select:none;-webkit-user-select:none}
.bar-in{display:flex;flex:1;min-width:0;border-radius:3px;overflow:hidden}
.bar.fresh .bar-in{animation:grow 280ms var(--out) both;transform-origin:left center}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.seg{display:flex;flex-direction:column;justify-content:center;padding:0 12px;min-width:0;overflow:hidden;white-space:nowrap}
.seg+.seg{border-left:var(--line)}
.seg b{font-weight:900;font-stretch:120%;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.seg span{font-size:12px;font-weight:700;opacity:.9;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.seg.tight{padding:0 4px;align-items:center}.seg.tight span{display:none}.seg.tight b{font-size:15px}
.seg.tiny b{display:none}
.hand{position:absolute;top:-8px;bottom:-8px;width:26px;margin-left:-13px;padding:0;border:0;background:transparent;cursor:ew-resize;touch-action:none;z-index:2}
.hand::before{content:"";position:absolute;left:7px;right:7px;top:0;bottom:0;background:var(--paper);border:var(--line);border-radius:6px;transition:transform 110ms var(--out)}
.hand::after{content:"";position:absolute;left:12px;width:2px;top:50%;height:18px;margin-top:-9px;background:var(--ink)}
.hand:hover::before,.hand.live::before{background:var(--mustard);transform:scaleX(1.25)}
.bar.empty{align-items:center;justify-content:space-between;padding:0 18px;gap:16px;background:repeating-linear-gradient(135deg,transparent 0 9px,#17140f1c 9px 11px),var(--paper)}
.bar.empty p{margin:0;font-weight:800;font-size:17px}
.bar.empty .btns{display:flex;gap:10px}
.bar.wait{align-items:center;padding:0 18px;overflow:hidden;background:var(--paper)}
.bar.wait p{margin:0;font-weight:800;font-size:17px;position:relative;z-index:1}
.bar.wait::before{content:"";position:absolute;inset:0;width:40%;background:var(--mustard);animation:sweep 900ms linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.opt{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 4px 0 8px;border:var(--line);border-radius:var(--r);background:var(--paper)}
.opt i{width:14px;height:14px;border:var(--line);border-radius:3px;flex:none}
.opt input{border:0;background:transparent;font-weight:700;font-size:14px;padding:0;min-width:24px;field-sizing:content}
.opt input:focus{outline:0;box-shadow:0 2px 0 var(--cobalt)}
.opt b{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);min-width:30px;text-align:right}
.opt button{border:0;background:transparent;font-weight:900;font-size:13px;width:24px;height:24px;border-radius:4px;color:var(--muted)}
.opt button:hover{background:var(--ink);color:var(--paper)}
.ai-note{margin:10px 0 0;font-size:13px;color:var(--muted);font-weight:600}
.addvar{width:100%;min-height:64px;border:2px dashed var(--ink);border-radius:var(--r);background:transparent;font-weight:900;font-size:18px;font-stretch:110%;transition:transform 110ms var(--out)}
.addvar:hover{background:var(--paper)}.addvar:active{transform:scale(.99)}
.brief{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.strip{min-height:150px;padding:18px 20px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);font-size:19px;line-height:1.75;font-weight:500}
.strip:focus{outline:3px solid var(--cobalt);outline-offset:3px}
.ph{display:inline-block;padding:0 9px;margin:0 2px;border:var(--line);border-radius:4px;background:var(--mustard);font-weight:800;font-size:15px;line-height:1.55;white-space:nowrap;cursor:default}
.ph.bad{background:var(--blush)}
.palette{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.palette span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.palette button{padding:0 10px;height:32px;border:var(--line);border-radius:4px;background:var(--mustard);font-weight:800;font-size:14px;cursor:grab;box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out)}
.palette button:active{transform:translate(2px,2px);box-shadow:none}
.who{border:var(--line);border-radius:var(--r);background:var(--ink);color:var(--paper);padding:18px 20px}
.who-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.who-top strong{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.who p{margin:0;font-size:16px;line-height:1.6}
.who mark{background:transparent;color:var(--mustard);font-weight:800}
.who mark.miss{color:var(--blush);text-decoration:underline wavy}
.who .btn{background:var(--paper);color:var(--ink);box-shadow:none;border-color:var(--paper)}

/* actions */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{position:relative;height:148px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);transition:transform 110ms var(--out)}
.tile.on{background:var(--cobalt);color:#fff;box-shadow:none;transform:translate(4px,4px)}
.tile.main{grid-column:span 2;background:var(--mustard);color:var(--ink)}
.tile-press{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:16px;border:0;background:transparent;text-align:left;border-radius:4px;width:100%}
.tile-press svg{width:34px;height:34px}
.tile-press strong{font-weight:900;font-stretch:110%;font-size:20px;line-height:1.1}
.tile:not(.on):active{transform:translate(4px,4px);box-shadow:none}
.tile .state{position:absolute;top:14px;right:14px;font-size:11px;font-weight:800;letter-spacing:.09em;pointer-events:none}
.opt b:empty{display:none}
.opt:has(b:empty){padding-right:8px}
.tile .mk{position:absolute;right:46px;top:8px;height:28px;padding:0 9px;border:2px solid currentColor;border-radius:4px;background:transparent;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.tile .mk:hover{background:var(--mustard);color:var(--ink);border-color:var(--ink)}
.tile .rm{position:absolute;right:10px;top:8px;width:28px;height:28px;color:var(--ink)}
.tile .state:has(+.rm){right:48px}
.tile .rm+.mk{right:80px}
.tile.main .state{position:static;display:inline-flex;margin:0}
.maintag{position:absolute;top:14px;right:14px;height:24px;padding:0 9px;display:inline-flex;align-items:center;background:var(--ink);color:var(--paper);border-radius:4px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.tile.add{box-shadow:none;border-style:dashed;background:transparent;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:16px}
.tile.add input{height:44px;padding:0 12px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:700;width:100%}
.tile.add .btn{align-self:flex-start}

/* run */
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sumbox{border:var(--line);border-radius:var(--r);background:var(--paper);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sumbox header{display:flex;align-items:center;justify-content:space-between}
.sumbox h3{margin:0;font-weight:900;font-stretch:112%;font-size:22px}
.big{font-weight:900;font-stretch:125%;font-size:54px;line-height:.9;letter-spacing:-.02em}
.big small{font-size:15px;font-weight:700;font-stretch:100%;letter-spacing:0;margin-left:8px;color:var(--muted)}
.vlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-weight:700;font-size:15px}
.vlist li{display:flex;align-items:center;gap:8px}
.badge{display:inline-grid;place-items:center;width:24px;height:24px;border:var(--line);border-radius:4px;font-weight:900;font-size:13px;flex:none}
.mini{display:flex;height:14px;border:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:60px}
.mini i+i{border-left:1.5px solid var(--ink)}
.mini.none{background:repeating-linear-gradient(135deg,transparent 0 5px,#17140f33 5px 7px)}
.vlist .nm{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{height:26px;display:inline-flex;align-items:center;padding:0 8px;border:var(--line);border-radius:4px;font-size:13px;font-weight:700}
.chips span.m{background:var(--mustard)}
.go{margin-top:28px;display:flex;align-items:center;gap:22px}
.runbtn{min-height:92px;padding:0 40px;border:var(--line);border-radius:var(--r);background:var(--tomato);color:#fff;box-shadow:6px 6px 0 var(--ink);font-weight:900;font-stretch:125%;font-size:34px;letter-spacing:-.01em;transition:transform 120ms var(--out)}
.runbtn:active{transform:translate(6px,6px);box-shadow:none}
.go p{margin:0;color:var(--muted);font-weight:600;max-width:36ch}
.prog{margin-top:28px;border:var(--line);border-radius:var(--r);background:var(--paper);padding:22px 24px;box-shadow:var(--sh)}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.cells{display:grid;grid-template-columns:repeat(25,1fr);gap:5px}
.cells i{aspect-ratio:1;border:var(--line);border-radius:3px}
.cells i.f{animation:pop 180ms var(--out) both}
@keyframes pop{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
.tick{margin:16px 0 0;font-weight:700;font-size:15px;min-height:22px}

/* results */
.res-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
.res-head .ask{font-size:clamp(36px,4.2vw,54px);max-width:17ch;margin-bottom:10px}
.res-tools{display:flex;gap:10px;flex:none}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-items:center;padding:16px 18px;border:var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:22px}
.ctrl .lbl{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{height:38px;padding:0 13px;border:var(--line);border-radius:var(--r);background:var(--paper);font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out);white-space:nowrap}
.pill:active{transform:translate(2px,2px);box-shadow:none}
.pill[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none;transform:translate(2px,2px)}
.pill .star{color:var(--mustard);margin-right:5px}
.gap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 22px;padding:12px 16px;border:var(--line);border-radius:var(--r);background:var(--mustard);font-weight:700;font-size:15px}
.gap strong{font-weight:900}
.gap .lead{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 4px;background:var(--paper);border:var(--line);border-radius:4px;font-size:13px;font-weight:800}
.cols{display:grid;gap:20px;align-items:start}
.col-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.col-head .badge{width:34px;height:34px;font-size:18px}
.col-head h3{margin:0;font-weight:900;font-stretch:112%;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-head .win{margin-left:auto}
.track{position:relative;display:flex;height:270px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.sub{position:relative;flex:1;min-width:0}
.sub+.sub{border-left:1.5px solid #17140f40}
.lift{position:absolute;inset:0;transition:transform 280ms var(--out)}
.fill{position:absolute;inset:0;border-top:var(--line)}
.num{position:absolute;left:12px;top:10px;font-weight:900;font-stretch:125%;font-size:60px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num small{font-size:.42em;letter-spacing:0;margin-left:2px}
.lift[data-light] .num{color:#fff}
.lift.low .num{top:auto;bottom:calc(100% + 8px);color:var(--ink)}
.track.split .num{font-size:19px;left:0;right:0;text-align:center;letter-spacing:-.01em}
.track.split .num small{display:none}
.optrow{display:flex;margin-top:7px}
.optrow span{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cap{margin:7px 0 0;font-size:12px;font-weight:700;color:var(--muted)}
.spread{margin-top:20px;border:var(--line);border-radius:var(--r);background:var(--paper);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) 40px;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border:0;border-bottom:1.5px solid #17140f22;background:transparent;text-align:left;font-size:13px;font-weight:700}
.row:last-child{border-bottom:0}
.row:hover{background:#17140f0d}
.row[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rb{height:12px;border-radius:2px;transform-origin:left center;transition:transform 280ms var(--out);outline:1.5px solid var(--ink)}
.row[aria-pressed=true] .rb{outline-color:var(--paper)}
.row b{text-align:right;font-variant-numeric:tabular-nums;font-weight:900}
.why{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.note{position:relative;border:var(--line);border-radius:var(--r);background:var(--paper);padding:16px 16px 14px;border-top-width:8px}
.note::before{content:"";position:absolute;left:22px;top:-22px;width:2px;height:14px;background:var(--ink)}
.note h4{margin:0 0 6px;font-weight:900;font-stretch:110%;font-size:18px;line-height:1.15}
.note p{margin:0 0 10px;font-size:14px;line-height:1.5}
.note blockquote{margin:0 0 10px;padding:10px 12px;background:var(--ground);border-left:4px solid var(--ink);font-size:15px;font-weight:700;line-height:1.4}
.note cite{display:block;margin-top:6px;font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.note footer{display:flex;align-items:center;justify-content:space-between;gap:8px}
.note footer span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (max-width:1180px){
  .top{gap:12px;padding:0 16px}.top-name{display:none}
  .stage{padding:0 9px 0 6px;font-size:13px}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* compact scale: chosen base; overrides the sizes above */
:root{--sh:3px 3px 0 var(--ink);--r:5px}
body{font-size:14px}

.top{height:52px;padding:0 20px;gap:16px}
.brand{font-size:14px;padding:5px 9px}
.stage{height:30px;font-size:13px;padding:0 10px 0 5px;gap:6px}
.stage b{width:20px;height:20px;font-size:11px}
.stage-gap{width:10px}.stage-gap.wide{width:18px}

.page{max-width:1180px;padding:28px 28px 96px}
.ask{font-size:clamp(30px,3.2vw,42px);margin-bottom:8px}
.hint{font-size:15px}
.head{margin-bottom:24px}
.sec{margin-bottom:28px}
.lbl{font-size:11px;margin-bottom:8px}
.btn{min-height:36px;padding:0 14px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(2px,2px)}
.btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.x{width:28px;height:28px;font-size:13px}
.foot{margin-top:32px;padding-top:16px}
.foot .btn{min-height:42px;padding:0 18px;font-size:14px}

/* material */
.name-in{font-size:28px;border-bottom-width:3px}
.slabs{gap:8px}
.slab{grid-template-columns:28px 56px 1fr auto}
.letter{font-size:30px}
.slab-body{padding:9px 14px}
.slab-name{font-size:17px}
.slab-tools{padding:0 10px}
.drop{padding:14px 16px}
.drop strong{font-size:16px}
.drop p{font-size:13px}

/* participants */
.count input{width:110px;height:44px;font-size:24px}
.step{width:44px;height:44px;font-size:22px;box-shadow:2px 2px 0 var(--ink)}
.step:active{transform:translate(2px,2px)}
.var{margin-bottom:20px}
.var-head{margin-bottom:7px}
.var-name{font-size:24px;font-stretch:115%;letter-spacing:-.01em}
.var-icw{position:relative;flex:none}
.var-ic{display:grid;place-items:center;width:34px;height:34px;padding:0;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out)}
.var-ic:active,.var-ic[aria-expanded=true]{transform:translate(2px,2px);box-shadow:none}
.var-ic[aria-expanded=true]{background:var(--mustard)}
.var-ic svg{width:20px;height:20px}
.ipick{position:absolute;left:0;top:calc(100% + 8px);z-index:10;display:grid;grid-template-columns:repeat(11,32px);gap:4px;padding:8px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);animation:rise 160ms var(--out) both}
.ipick button{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper)}
.ipick button svg{width:18px;height:18px}
@media (hover:hover){.ipick button:hover{background:var(--ground)}}
.ipick button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.tag{height:20px;font-size:10px}
.bar{height:54px}
.seg{padding:0 9px}
.seg b{font-size:19px}
.seg span{font-size:11px;margin-top:2px}
.seg.tight b{font-size:13px}
.hand{top:-6px;bottom:-6px}
.hand::after{height:14px;margin-top:-7px}
.bar.empty p,.bar.wait p{font-size:14px}
.legend{margin-top:9px;gap:6px}
.opt{height:28px}
.opt input{font-size:13px}
.opt b{font-size:12px}
.opt button{width:20px;height:20px}
.addvar{min-height:44px;font-size:15px}
.brief{gap:16px}
.strip{min-height:110px;padding:12px 14px;font-size:15px;line-height:1.7}
.ph{font-size:13px;padding:0 7px}
.palette{margin-top:10px}
.palette button{height:26px;font-size:12px}
.who{padding:12px 14px}
.who p{font-size:14px}

/* actions */
.tiles{grid-template-columns:repeat(5,1fr);gap:10px}
.tile{height:96px}
.tile.on,.tile:not(.on):active{transform:translate(3px,3px)}
.tile-press{padding:11px}
.tile-press svg{width:24px;height:24px}
.tile-press strong{font-size:15px}
.tile .state{top:10px;right:10px;font-size:10px}
.tile .mk{height:22px;top:6px;right:38px;padding:0 6px;font-size:10px;border-width:1.5px}
.tile .rm{width:22px;height:22px;top:6px;right:8px}
.tile .state:has(+.rm){right:36px}
.tile .rm+.mk{right:66px}
.maintag{top:10px;right:10px;height:20px;font-size:10px}
.tile.add{height:auto;min-height:96px;padding:10px;gap:8px}
.tile.add input{height:32px;flex:none}

/* run */
.sum{gap:10px}
.sumbox{padding:12px 14px;gap:8px}
.sumbox h3{font-size:17px}
.big{font-size:38px}
.big small{font-size:13px}
.vlist{font-size:13px;gap:4px}
.badge{width:20px;height:20px;font-size:11px}
.mini{height:11px}
.chips span{height:22px;font-size:12px}
.go{margin-top:18px;gap:16px}
.runbtn{min-height:60px;padding:0 28px;font-size:24px;box-shadow:4px 4px 0 var(--ink)}
.runbtn:active{transform:translate(4px,4px)}
.prog{margin-top:18px;padding:14px 16px}
.cells{gap:4px}
.tick{font-size:13px;margin-top:10px}

/* results */
.res-head{margin-bottom:18px}
.res-head .ask{font-size:clamp(28px,3vw,38px)}
.ctrl{padding:10px 12px;gap:8px 14px;margin-bottom:14px}
.pills{gap:6px}
.pill{height:30px;padding:0 10px;font-size:13px}
.gap{padding:8px 12px;font-size:13px;margin-bottom:14px}
.gap .lead{height:24px;font-size:12px}
.cols{gap:14px}
.col-head{margin-bottom:7px}
.col-head h3{font-size:18px}
.col-head .badge{width:28px;height:28px;font-size:15px}
.track{height:170px}
.num{font-size:42px;left:10px;top:8px}
.track.split .num{font-size:15px}
.spread{margin-top:12px}
.row{height:28px;font-size:12px}
.row .rb{height:10px}
.why{margin-top:14px;gap:10px}
.note{padding:11px 12px 10px;border-top-width:6px}
.note h4{font-size:15px}
.note p{font-size:13px;margin-bottom:8px}
.note blockquote{font-size:13px;padding:8px 10px;margin-bottom:8px}

/* follow-up questions (actions page) */
.qs{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;align-items:center;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.q-mark{display:grid;place-items:center;align-self:stretch;min-height:44px;border-right:var(--line);background:var(--mustard);font-weight:900;font-stretch:125%;font-size:22px}
.q-text{width:100%;min-width:0;height:44px;padding:0 14px;border:0;background:transparent;font-weight:800;font-stretch:105%;font-size:16px}
.q-text:focus{outline:0;box-shadow:inset 0 -3px 0 var(--cobalt)}
.each{height:28px;margin-right:8px;padding:0 9px;border:var(--line);border-radius:4px;background:var(--paper);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out)}
.each[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none;transform:translate(2px,2px)}
.q .x{margin-right:10px}
.q.add{grid-template-columns:44px minmax(0,1fr) auto;border-style:dashed;background:transparent;box-shadow:none}
.q.add .q-mark{background:transparent;border-right-style:dashed}
.q.add .q-text{font-weight:700}
.q.add .btn{margin-right:8px}
.chips span.qchip{background:var(--ground);font-weight:700}
.tick .tk svg{width:16px;height:16px;vertical-align:-3px}

/* results: metric icons */
.pill.ico{display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:40px;padding:0 9px}
.pill.ico svg{width:17px;height:17px;flex:none}
.pill.ico .star{margin:0}
.mname{align-self:center;margin-left:6px;font-weight:800;font-size:13px}
.vd .row{grid-template-columns:24px minmax(0,1fr) 40px}
.vd .row .ri{display:grid;place-items:center}
.vd .row .ri svg{width:16px;height:16px}
.note footer .nf{display:inline-flex;align-items:center;gap:4px}
.note footer .nf svg{width:15px;height:15px}

/* results: the ranking, one big row per version, sized to fill the page */
.lb-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.lb-head .lbl{margin:0}
.lb-by{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:13px}
.lb-by svg{width:16px;height:16px}
.lb-tip{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.lb{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.lb-row{display:grid;grid-template-columns:84px 84px minmax(0,1fr) 104px 56px;min-height:max(132px,calc((100vh - 330px) / var(--n,3) - 12px));border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden;cursor:pointer;transition:transform 110ms var(--out),box-shadow 110ms var(--out)}
.lb-row:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.lb-row:active{transform:translate(3px,3px);box-shadow:none}
.lb-rank,.lb-letter{display:grid;place-items:center;border-right:var(--line);font-weight:900;font-stretch:125%;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.lb-rank{background:var(--ground)}
.lb-row.first .lb-rank{background:var(--mustard)}
.lb-letter{padding:0;border:0;border-right:var(--line);border-radius:0;font-size:44px;cursor:pointer}
.lb-body{display:flex;flex-direction:column;justify-content:center;gap:12px;min-width:0;padding:16px 22px}
.lb-name{display:flex;align-items:center;gap:10px;min-width:0}
.lb-name strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:900;font-stretch:112%;font-size:26px;line-height:1.1}
.lb-score{display:flex;align-items:center;gap:16px}
.lb-bar{position:relative;flex:1;height:34px;border:var(--line);border-radius:4px;background:var(--ground);overflow:hidden}
.lb-bar u,.rsn u{position:absolute;left:0;top:0;bottom:0;display:block;text-decoration:none}
.lb-bar u{border-right:var(--line)}
.lb-score b{min-width:100px;text-align:right;font-weight:900;font-stretch:125%;font-size:42px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lb-score b small{font-size:.5em;margin-left:1px}
.lb-why{display:flex;flex-wrap:wrap;gap:6px}
.rz{display:inline-flex;align-items:center;height:28px;padding:0 10px;border:1.5px solid var(--ink);border-radius:4px;background:var(--ground);font-weight:800;font-size:13px;white-space:nowrap;transition:transform 110ms var(--out)}
.rz:hover{background:var(--mustard)}
.rz:active{transform:scale(.97)}
.lb-delta{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:var(--line);font-weight:900;font-stretch:115%;font-size:26px;font-variant-numeric:tabular-nums}
.lb-delta small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lb-go{display:grid;place-items:center;border-left:var(--line);background:var(--ink);color:var(--paper);font-weight:900;font-size:24px;transition:background 110ms}
.lb-row:hover .lb-go{background:var(--tomato)}

/* results: why tags */
.rs{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border:var(--line);border-top-width:6px;border-radius:var(--r);background:var(--paper)}
.rs-head{display:flex;align-items:center;gap:7px;margin-bottom:2px;font-weight:900;font-stretch:108%;font-size:14px;line-height:1.2}
.rs-head svg{width:16px;height:16px;flex:none}
.rs-head .badge{width:22px;height:22px;font-size:12px}
.rsn{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 8px;width:100%;padding:6px 9px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);font-weight:800;font-size:13px;text-align:left;transition:transform 110ms var(--out)}
.rsn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsn b{font-variant-numeric:tabular-nums}
.rsn i{position:relative;grid-column:1/-1;height:7px;border:1.5px solid var(--ink);border-radius:2px;background:var(--ground);overflow:hidden}
.rsn:hover{background:var(--ground)}
.rsn:active{transform:scale(.99)}
.rsn[aria-expanded=true]{background:var(--ink);color:var(--paper)}
.rsn[aria-expanded=true] i{border-color:var(--paper)}
/* results: who gave a reason */
.rq{display:flex;flex-direction:column;gap:8px;margin:2px 0 6px;padding:10px;border:1.5px solid var(--ink);border-radius:4px;background:var(--ground);animation:rise 200ms var(--out) both}
.who-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.who-h>b{font-weight:900;font-stretch:115%;font-size:15px}
.over{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--mustard);font-weight:800;font-size:12px;white-space:nowrap}
.over svg{width:14px;height:14px;flex:none}
.over em{font-style:normal;font-weight:700;opacity:.7}
.pict{display:flex;flex-wrap:wrap;gap:3px}
.pict i{display:grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--ink);border-radius:3px}
.pict svg{width:13px;height:13px}
.c-paper{background:var(--paper);color:var(--ink)}
.wv{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:center;gap:3px 8px}
.wv-ic{display:grid;place-items:center}
.wv-ic svg{width:18px;height:18px}
.wv-bar{display:flex;height:26px;border:var(--line);border-radius:3px;background:var(--paper);overflow:hidden}
.wv-bar span{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;overflow:hidden;font-weight:900;font-size:11px;font-variant-numeric:tabular-nums}
.wv-bar span+span{border-left:1.5px solid var(--ink)}
.wv-bar svg{width:14px;height:14px;flex:none}
.wv-leg{grid-column:2;display:flex;flex-wrap:wrap;gap:2px 9px;font-size:11px;font-weight:700;color:var(--muted)}
.wv-leg span{display:inline-flex;align-items:center;gap:3px}
.wv-leg i{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:2px}
.wv-leg svg{width:11px;height:11px}
.forms{margin:0;font-size:11px;font-weight:700;color:var(--muted)}
.rq blockquote{margin:0;padding:8px 10px;background:var(--paper);border-left:4px solid var(--ink);font-size:13px;font-weight:700;line-height:1.4}
.rq cite{display:block;margin-top:5px;font-style:normal;font-size:11px;font-weight:600;color:var(--muted)}
.rs-none{margin:0;font-size:12px;font-weight:700;color:var(--muted)}
.rs-head .q-mark{width:22px;min-height:22px;border:var(--line);border-radius:4px;font-size:13px}

/* results: one version per page */
.vtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.vsw{display:flex;flex-wrap:wrap;gap:8px;margin-right:auto}
.vstep{display:flex;gap:6px}
.vpick{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 5px;border:var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);transition:transform 110ms var(--out)}
.vpick:active{transform:translate(2px,2px);box-shadow:none}
.vpick[aria-current=page]{background:var(--ink);color:var(--paper);box-shadow:none;transform:translate(2px,2px)}
.vpick[aria-current=page] .badge{border-color:var(--paper)}
.vd-head{display:grid;grid-template-columns:72px minmax(0,1fr) 84px;margin-bottom:16px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.vd-letter{display:grid;place-items:center;border-right:var(--line);font-weight:900;font-stretch:125%;font-size:42px}
.vd-title{min-width:0;padding:12px 16px}
.vd-title h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-weight:900;font-stretch:112%;font-size:24px;line-height:1.1}
.vd-title p{margin:0;max-width:90ch;font-size:14px;color:#3b372f}
.vd-rank{display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:var(--line);background:var(--ground)}
.vd-rank b{font-weight:900;font-stretch:125%;font-size:34px;line-height:1}
.vd-rank small{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vd-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:20px;align-items:start}
.vd .track{height:230px}
.vd .num{font-size:56px}
.vd .row{height:34px;font-size:13px}
.vd .row .ri svg{width:18px;height:18px}
.vd .why{margin-top:0}
@media (max-width:900px){.vd-grid{grid-template-columns:minmax(0,1fr)}}

/* top bar: contents follow the page column, the stages sit dead centre */
.top{padding:0}
.top-in{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px;width:100%;max-width:1180px;height:100%;margin:0 auto;padding:0 28px}
.top-l{display:flex;align-items:center;gap:10px;min-width:0}
.top-r{display:flex;justify-content:flex-end;min-width:0}
.top-in .stages{margin:0}
@media (max-width:1180px){.top-in{gap:12px;padding:0 16px}}
@media (max-width:900px){
  .lb-row{grid-template-columns:56px 56px minmax(0,1fr) 72px}
  .lb-go{display:none}
  .lb-rank,.lb-letter{font-size:32px}
  .lb-score b{min-width:70px;font-size:30px}
}

/* home */
a.brand{text-decoration:none;transition:transform 110ms var(--out)}
a.brand:active{transform:scale(.97)}
.tag.st-done{background:var(--leaf);color:#fff}
.tag.st-running{background:var(--mustard);color:var(--ink)}
.tag.st-draft{background:var(--paper);color:var(--ink)}
.hname{display:block;font-weight:900;font-stretch:112%;font-size:18px;line-height:1.14}
.hsub{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta{display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}
.hwin{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hscore{margin-left:auto;font-weight:900;font-stretch:125%;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.hprog{flex:1;min-width:40px;height:11px;border:var(--line);border-radius:3px;overflow:hidden;background:var(--paper)}
.hprog i{display:block;height:100%;background:var(--mustard);border-right:var(--line)}
.hpc{font-weight:900;font-variant-numeric:tabular-nums}
.hnext{font-weight:800}
/* home: rows */
.hrows{border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.hrow{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-bottom:1.5px solid #17140f22;background:transparent;text-align:left;font-size:13px;font-weight:700}
.hrow:last-child{border-bottom:0}

.hrow-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hrow-out{display:flex;align-items:center;gap:8px;min-width:0}

/* home: featured */

.hfeat-main{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:18px 20px}
.hfeat-tags{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:12px;font-weight:700;color:var(--muted)}
.hfeat-name{font-weight:900;font-stretch:125%;font-size:30px;line-height:1;letter-spacing:-.02em}
.hfeat-main .hsub{margin-top:8px;font-size:13px;max-width:100%}
.hfeat-main .hmeta{margin-bottom:18px}
.hfeat-main .btn{margin-top:auto}
.hfeat-side{display:flex;flex-direction:column;justify-content:center;gap:8px;min-width:0;padding:18px 20px;border-left:var(--line);background:var(--ground)}
.hfeat-side .lbl{margin:0}
.hfeat-side .spread{display:block;margin-top:0}
.hfeat-side .row{height:34px;font-size:13px}
.hfeat-side .row:hover{background:transparent}
.hfeat-side .row .badge{margin-right:7px;vertical-align:middle}
.hfeat-side .hprog{flex:none;height:14px}
.hearlier{margin-top:24px}


/* treatments: parts or types, and slots */
.mtop{display:flex;align-items:flex-end;gap:16px}
.mtop .name-in{flex:1;min-width:0}
.mtop .btn{flex:none;margin-bottom:6px}
.name-in.title{font-size:clamp(30px,3.2vw,42px);font-stretch:125%;letter-spacing:-.025em;line-height:1.05;padding:0 0 8px}
.x[disabled]{opacity:.3;cursor:not-allowed}
.x[disabled]:hover{background:var(--paper);color:var(--ink)}
.slot{min-width:0;background:var(--paper)}
.slot textarea{display:block;width:100%;min-height:64px;max-height:220px;padding:8px 10px;border:0;background:transparent;resize:none;font-size:13px;line-height:1.5;font-weight:500;field-sizing:content}
.slot textarea:focus{outline:0;box-shadow:inset 0 0 0 2px var(--cobalt)}
.slot.empty{background:repeating-linear-gradient(135deg,transparent 0 9px,#17140f17 9px 11px),var(--paper)}
.slot.empty textarea::placeholder{color:var(--ink);opacity:.75;font-weight:700}
.sfile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 10px;min-height:64px}
.sfile strong{font-size:13px;font-weight:800}
.sfile p{margin:0;font-size:12px;line-height:1.45;color:#3b372f;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sfile-top{display:flex;align-items:center;gap:6px;max-width:100%}
.sfile-top .tag{display:block;max-width:190px;line-height:16px;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:0;font-size:11px}
.sfile-top.full{width:100%}
.sfile-top .btn{margin-left:auto}
.sfile small{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.slotbox{border:var(--line);border-radius:4px;overflow:hidden;min-width:0}
.slotbox>.lbl{margin:0;padding:4px 10px;background:var(--ground);border-bottom:1.5px solid #17140f33;font-size:10px}
.fname{flex:1;min-width:50px;border:0;border-bottom:2px solid transparent;background:transparent;font-weight:900;font-stretch:110%;font-size:14px;padding:2px 0}
.fname:hover{border-bottom-color:#17140f33}
.fname:focus{outline:0;border-bottom-color:var(--cobalt)}
.ftype{display:inline-flex;flex:none;border:var(--line);border-radius:4px;overflow:hidden}
.ftype button{height:20px;padding:0 6px;border:0;background:var(--paper);font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.ftype button+button{border-left:var(--line)}
.ftype button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.fedit .x{width:22px;height:22px;font-size:11px;flex:none}
.fconfirm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;min-width:0;font-size:12px;font-weight:800}
.drop{margin-top:12px}
.drop-btns{align-items:center;flex-wrap:wrap;justify-content:flex-end}
.check{margin:18px 0 0}
.check.ok{background:var(--paper)}
.sumbox .chips{margin-top:2px}
.sumbox{min-width:0}
.sumbox .chips span{height:auto;min-height:22px;max-width:100%;padding:3px 8px;line-height:1.3;overflow-wrap:anywhere}
/* the count's word drops under a wide number rather than leaving the box */
.sumbox .big{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:6px}
.sumbox .big small{margin-left:0}
/* treatments: one tab per part or type */
.ftabs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px}
.ftabs .pill small{margin-left:7px;font-size:11px;font-weight:800;opacity:.65;font-variant-numeric:tabular-nums}
.fedit{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 10px;margin-bottom:10px;border:var(--line);border-radius:var(--r);background:var(--paper)}
.dbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;font-weight:700;color:var(--muted)}
.dbar .pill{height:26px;padding:0 9px;font-size:12px;color:var(--ink)}
.dbar .pill[aria-pressed=true]{background:var(--mustard);color:var(--ink)}
/* differences: a marked copy of the text sits exactly behind the textarea */
.slot{position:relative}
.hl{position:absolute;inset:0;padding:8px 10px;font-size:13px;line-height:1.5;font-weight:500;white-space:pre-wrap;overflow-wrap:break-word;color:transparent;pointer-events:none;overflow:hidden}
.hl mark{color:transparent;background:var(--mustard);border-radius:2px;box-shadow:0 0 0 1.5px var(--mustard)}
.slot textarea{position:relative}
.sfile p mark{background:var(--mustard);color:var(--ink);border-radius:2px;box-shadow:0 0 0 1.5px var(--mustard)}
.fedit .lbl{margin:0 6px 0 0}
.fedit .fname{font-size:16px}
.vcols{display:flex;flex-direction:column;gap:10px}
.vcol{display:grid;grid-template-columns:230px minmax(0,1fr);min-width:0;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.vcol .col-head{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0;margin:0;align-items:start}
.vcol .col-head .badge{grid-row:1/3;width:auto;height:100%;border:0;border-right:var(--line);border-radius:0;font-size:28px;font-stretch:125%}
.vcol .col-head .slab-name{padding:10px 10px 0}
.vcol .col-head .vt{display:flex;gap:4px;padding:6px 10px 10px}
.vcol .slotbox{border:0!important;border-left:1.5px solid #17140f22!important;border-radius:0}
.vcol .col-head .slab-name{flex:1;min-width:0;font-size:16px}
.vcol .col-head .x{width:24px;height:24px;font-size:11px;flex:none}
.vcol .slot textarea{min-height:68px;max-height:none;overflow:hidden;font-size:14px;line-height:1.6}
.vcol .hl{font-size:14px;line-height:1.6}
.vcol .sfile{min-height:68px}
.vcol .sfile p{-webkit-line-clamp:14;font-size:13px;line-height:1.55}
.vadd{min-height:44px;border:2px dashed var(--ink);border-radius:var(--r);background:transparent;font-weight:900;font-size:14px;transition:transform 110ms var(--out)}
@media (hover:hover){.vadd:hover{background:var(--paper)}}
.vadd:active{transform:scale(.98)}

/* ---- additions for imported runs (see data/triage-runs.js) ---- */
/* material: long text files */
.sfile p{white-space:pre-wrap}
.sfile-top .btn+.btn{margin-left:0}
.vcol .sfile.open p{display:block;-webkit-line-clamp:unset;overflow:visible}
/* participants */
.addrow{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.ai-note a{color:inherit;font-weight:800}
/* actions: who decides the outcome */
.judge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.judge .ai-note{margin:4px 0 10px}
.jtext{display:block;width:100%;min-height:300px;padding:12px 14px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);font-size:13px;line-height:1.55;font-weight:500;resize:vertical}
.jtext:focus{outline:3px solid var(--cobalt);outline-offset:3px}
.jl{margin-top:0}
.jl .row{grid-template-columns:minmax(0,1.7fr) minmax(0,.6fr) 48px;height:auto;min-height:40px;padding:5px 12px;cursor:default}
.jl .row span{white-space:normal;line-height:1.3}
.jl .row em{display:block;font-style:normal;font-weight:600;font-size:11px;color:var(--muted)}
@media (max-width:900px){.judge{grid-template-columns:minmax(0,1fr)}}
.mhead{flex:1;min-width:0}
/* actions: a brief description on each tile */
.tile{height:128px}
.tile.add{min-height:128px}
.tile-press{padding-bottom:46px}
.tdesc{position:absolute;left:10px;bottom:9px;width:calc(100% - 20px);height:27px;padding:0 8px;border:1.5px solid currentColor;border-radius:4px;background:transparent;font-size:12px;font-weight:600}
.tdesc::placeholder{color:currentColor;opacity:.65}
.tdesc:focus{outline:0;box-shadow:0 0 0 2px var(--mustard)}
/* prompt page: settings in a row, then one column of chat-style messages */
.llm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lf{display:flex;flex-direction:column;min-width:0}
.sel{height:40px;min-width:0;padding:0 10px;border:var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);font:inherit;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.sel[disabled]{opacity:.45;box-shadow:none}
.lnote{font-size:12px;font-weight:600;color:var(--muted)}
p.lnote{margin:10px 0 0}
.mname+.lnote{align-self:center;margin-left:10px}
.chat{display:flex;flex-direction:column;gap:14px;max-width:800px;margin-left:auto;margin-right:auto}
.chat-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.chat-top strong{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.pvs{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.pvs .lbl{margin:0 4px 0 0}
.pv{width:26px;height:26px;border:var(--line);border-radius:4px;background:var(--paper);font-weight:900;font-size:12px}
.pv[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.msg{align-self:flex-start;width:92%;padding:14px 16px 16px;border:var(--line);border-radius:12px 12px 12px 2px;background:var(--paper);box-shadow:var(--sh)}
.msg.me{align-self:flex-end;width:auto;max-width:70%;padding:9px 14px;border-radius:12px 12px 2px 12px;background:var(--sky);box-shadow:none;font-weight:700;font-size:13px}
.msg-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;margin-bottom:10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.msg-h b{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:0}
.msg-h span{margin-left:auto;font-weight:700;letter-spacing:.03em;text-transform:none;color:var(--muted)}
.msg .strip{min-height:0;padding:0;border:0;border-radius:3px;background:transparent;box-shadow:none;font-size:15px;line-height:1.85}
.msg pre{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:14px;line-height:1.6}
.msg pre:empty{display:none}
/* the audit: a collapsed system prompt, then the chat forks into one branch per question */
.sys{align-self:flex-start;width:92%;border:2px dashed var(--ink);border-radius:8px;background:transparent}
.sys summary{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;list-style:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.sys summary::-webkit-details-marker{display:none}
.sys summary b{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;background:var(--ink);color:var(--paper);font-size:12px;letter-spacing:0}
.sys summary span{margin-left:auto;padding:2px 8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);letter-spacing:.04em}
.sys summary span::after{content:"Show"}
.sys[open] summary span::after{content:"Hide"}
.sys pre{margin:0;padding:0 12px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:1.6}
.forknote{align-self:center;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.fork{position:relative;height:2px;margin:14px calc(50% / var(--n)) 0;background:var(--ink)}
.fork::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:14px;margin-left:-1px;background:var(--ink)}
.branches{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px 12px}
.fork+.branches{margin-top:-14px;padding-top:14px}
.branch{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.fork+.branches .branch::before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:14px;margin-left:-1px;background:var(--ink)}
.branch .msg{width:100%;padding:12px}
.branch .msg.me{align-self:flex-end;width:auto;max-width:100%}
.branch .fillin{margin-top:0;font-size:13px}
/* fill-in parts: a dark tag with where the text comes from, on a mustard wash */
.filled .msg .ph,.fillin{background:#f2b52b59;border-radius:3px}
.filled .msg .ph{display:inline;margin:0;padding:2px 6px 2px 0;border:0;font-weight:700;font-size:inherit;line-height:inherit;white-space:normal;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.filled .msg .ph.bad{background:var(--blush)}
.rawmat{margin-top:10px;font-size:14px;line-height:2}
.ph i,.fillin i{display:inline-block;margin-right:6px;padding:0 5px;border-radius:3px;background:var(--ink);color:var(--paper);font-style:normal;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;line-height:17px;vertical-align:1px}
.fillin{margin-top:10px;max-height:260px;overflow:auto;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.6;font-weight:600}
.fillin i{display:table;margin:0 0 5px}
.chat .palette{margin-top:4px;padding:12px 14px;border:2px dashed var(--ink);border-radius:var(--r)}
@media (max-width:900px){.llm{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* home: one separate box per run, a little wider than its name */
.hrows{display:flex;flex-direction:column;align-items:flex-start;gap:12px;border:0;background:transparent;box-shadow:none;overflow:visible}
.hrow{display:flex;width:auto;max-width:100%;gap:12px;min-height:66px;padding:0 48px 0 16px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);transition:transform 110ms var(--out)}
.hrow:last-child{border-bottom:var(--line)}
@media (hover:hover){button.hrow:hover{background:var(--paper);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}}
button.hrow:active{background:var(--paper);transform:translate(3px,3px);box-shadow:none}
.hrow-name strong{font-size:21px;font-stretch:112%}
.hrow .tag{flex:none;height:24px;padding:0 9px;font-size:11px;font-variant-numeric:tabular-nums}
.hrow .tag.dm{background:var(--sky)}
.tag.role{background:var(--ink);color:var(--paper)}
/* results in stages: one big tab per stage, above everything else */
.rstages{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:22px}
.rstage{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);text-align:left;transition:transform 110ms var(--out)}
.rstage b{display:grid;place-items:center;flex:none;width:34px;height:34px;border:var(--line);border-radius:var(--r);font-weight:900;font-size:18px;background:var(--ground)}
.rstage strong{display:block;font-weight:900;font-stretch:112%;font-size:18px;line-height:1.15}
.rstage small{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--muted)}
.rstage[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none;transform:translate(3px,3px)}
.rstage[aria-pressed=true] b{background:var(--mustard);color:var(--ink)}
.rstage[aria-pressed=true] small{color:#fffdf7b3}
.pill.ico.named{gap:6px;padding:0 11px}
/* treatments: the researcher's own visualisation of a version */
.vizctl{display:flex;align-items:center;gap:8px;margin-left:10px;flex:none;order:9}
.vizctl .lbl{margin:0}
.vizctl .tag{text-transform:none;letter-spacing:0;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcol.vseen{box-shadow:var(--sh),0 0 0 3px var(--cobalt)}
.vt .vsee{height:24px;padding:0 8px;border:var(--line);border-radius:4px;background:var(--paper);font-size:11px;font-weight:800}
.vt .vsee[aria-pressed=true]{background:var(--cobalt);color:#fff}
.viz{margin-top:22px;border:var(--line);border-radius:var(--r);background:var(--paper);box-shadow:var(--sh);overflow:hidden}
.viz>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-bottom:var(--line)}
.viz>header .lbl{margin:0}
.viz>header strong{font-weight:900;font-size:15px}
.viz>header small{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.viz>header .btn{flex:none}
.viz iframe{display:block;width:100%;height:560px;border:0;background:#fff}
.viz>header .x{width:26px;height:26px;font-size:12px;flex:none}
.viz{scroll-margin-top:70px}
.slot.shut{padding:10px 12px;background:var(--paper)}
.slot-top{display:flex;justify-content:flex-end;padding:6px 10px 0}
.hrow-name{margin-left:4px}
.hfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:56px;padding-top:14px;border-top:1.5px solid #17140f22;font-size:12px;font-weight:700;color:var(--muted)}
.hfoot .pill[aria-pressed=true]{background:var(--sky);color:var(--ink)}
.htools{justify-content:flex-end;margin-bottom:18px}
.hfoot{justify-content:flex-end}
/* home: the page fills the window so the run switches sit at its bottom edge */
.page.home{display:flex;flex-direction:column;min-height:calc(100vh - 52px);min-height:calc(100dvh - 52px);padding-bottom:20px}
.page.home .hrows{margin-bottom:56px}
.page.home .hfoot{margin-top:auto}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* the guide: a ring on the next thing to press. On first open it also dims the page and says where to start */
#gdim{position:fixed;inset:0;z-index:58;background:#17140fb8;pointer-events:none;opacity:0;transition:opacity 220ms}
#gdim.on{opacity:1}
#gring{position:fixed;z-index:59;display:none;border:3px solid var(--mustard);border-radius:10px;box-shadow:0 0 0 1.5px var(--ink),inset 0 0 0 1.5px var(--ink);pointer-events:none;animation:gpulse 1.3s var(--out) infinite}
#gring.on{display:block}
#gring span{position:absolute;top:calc(100% + 15px);right:0;padding:5px 10px;border:var(--line);border-radius:6px;background:var(--mustard);color:var(--ink);font-size:13px;font-weight:800;white-space:nowrap;box-shadow:2px 2px 0 var(--ink)}
#gring span::before{content:"";position:absolute;bottom:100%;right:24px;border:8px solid transparent;border-bottom-color:var(--ink)}
#gring span:empty{display:none}
#gjump{position:fixed;left:50%;z-index:59;display:none;width:40px;height:40px;margin-left:-20px;padding:0;border:var(--line);border-radius:50%;background:var(--mustard);color:var(--ink);font-size:18px;font-weight:900;box-shadow:2px 2px 0 var(--ink);cursor:pointer;animation:gbob .9s ease-in-out infinite alternate}
#gjump.down{display:block;bottom:18px}
#gjump.up{display:block;top:78px}
@keyframes gpulse{0%{outline:3px solid #f2b52be6;outline-offset:0}100%{outline:3px solid #f2b52b00;outline-offset:11px}}
@keyframes gbob{to{transform:translateY(5px)}}
/* results: a note under the heading, clamped version blurb, tighter ranking when there are many versions */
.caveat{display:flex;align-items:baseline;gap:8px;max-width:100ch;margin:10px 0 14px}
.caveat .tag{flex:none;align-self:center}
.vd-title p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.lb.many{gap:8px}
.lb.many .lb-row{min-height:88px;grid-template-columns:60px 60px minmax(0,1fr) 84px 44px}
.lb.many .lb-rank,.lb.many .lb-letter{font-size:32px}

  else if (t.dataset.bind === 'qtext' && !t.value.trim()) { S.questions = S.questions.filter(x => x.id !== t.dataset.id); render(); }
  else if (t.dataset.bind === 'fname') { const f = fieldOf(t.dataset.id); if (f && !f.name.trim()) { f.name = Fw(); render(); } }
  else if (t.dataset.bind === 'count') { S.count = Math.max(isReal(S.rid) ? 1 : 10, Math.min(5000, parseInt(t.value, 10) || 500)); t.value = S.count; refreshWho(); }
  else if (t.dataset.bind === 'varname') {
    const v = S.vars.find(x => x.id === t.dataset.id); if (!v.name.trim()) { v.name = 'Variable'; t.value = v.name; }
    let k = slug(v.name); if (v.id === 'pet' && k === 'owns_a_pet') k = 'pet_status';
    while (k === 'name' || S.vars.some(x => x !== v && x.key === k)) k += '_2';
    if (k !== v.key) { S.prompt = S.prompt.split('{' + v.key + '}').join('{' + k + '}'); v.key = k; const st = $('#strip'); if (st) { st.innerHTML = tplHtml(); $('#palette').innerHTML = paletteHtml(); refreshWho(); } }
  }
});
document.addEventListener('focusout', e => { if (e.target.id === 'strip') { readStrip(); e.target.innerHTML = tplHtml(); } });
document.addEventListener('submit', e => {
  if (e.target.id === 'addq') {
    e.preventDefault();
    const text = $('#newq').value.trim(); if (!text) { $('#newq').focus(); return; }
    /* "why did you..." style questions are asked once per action by default */
    S.questions.push({ id: 'q' + S.nextQ++, text, each: /\b(why|choice|chose|choose|decid)/i.test(text) }); render(); $('#newq').focus();
    return;
  }
  const form = e.target.closest('[data-addact]'); if (!form) return; e.preventDefault();
  const inp = $('input', form), name = inp.value.trim(), fid = form.dataset.addact; if (!name) { inp.focus(); return; }
  const x = { id: 'x' + S.nextAct++, name, on: true, custom: true, bad: BAD_RE.test(name) }; if (fid) x.fields = [fid];
  S.actions.push(x); if (!S.actions.some(q => q.id === S.main)) S.main = x.id;
  render(); const again = $(`[data-addact="${fid}"] input`); if (again) again.focus();
});

/* divider drag + keys */
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.hand'); if (!h) return;
  const bar = h.parentElement, v = S.vars.find(x => x.id === bar.dataset.bar), i = +h.dataset.hand;
  drag = { v, i, bar, h, before: i ? cum(v, i - 1) : 0 }; h.setPointerCapture(e.pointerId); h.classList.add('live'); e.preventDefault(); h.focus();
});
document.addEventListener('pointermove', e => {
  if (!drag) return; const r = drag.bar.getBoundingClientRect();
  setPair(drag.v, drag.i, (e.clientX - r.left) / r.width * 100 - drag.before);
});
const endDrag = () => { if (drag) { drag.h.classList.remove('live'); drag = null; } };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
document.addEventListener('keydown', e => {
  const h = e.target.closest && e.target.closest('.hand'); if (!h) return;
  const d = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key]; if (!d) return;
  e.preventDefault(); e.stopPropagation();
  const v = S.vars.find(x => x.id === h.parentElement.dataset.bar), i = +h.dataset.hand;
  setPair(v, i, v.opts[i].pct + d * (e.shiftKey ? 5 : 1));
}, true);

/* drag placeholders into the strip */
document.addEventListener('dragstart', e => {
  const ph = e.target.closest && e.target.closest('.palette button');
  if (ph) { e.dataTransfer.setData('text/x-ph', ph.dataset.ph); e.dataTransfer.effectAllowed = 'copy'; return; }
  const g = e.target.closest && e.target.closest('.grip');
  if (g) { const sl = g.closest('.slab'); e.dataTransfer.setData('text/x-vid', sl.dataset.vid); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setDragImage(sl, 20, 20); sl.classList.add('dragging'); }
});
document.addEventListener('dragend', () => $$('.slab').forEach(s => s.classList.remove('dragging', 'over')));
document.addEventListener('dragover', e => {
  const types = [...e.dataTransfer.types];
  if (types.includes('text/x-ph') && e.target.closest('#strip')) e.preventDefault();
  else if (types.includes('text/x-vid')) { const sl = e.target.closest('.slab'); $$('.slab').forEach(s => s.classList.toggle('over', s === sl)); if (sl) e.preventDefault(); }
  else if (types.includes('Files') && e.target.closest('#drop')) { e.preventDefault(); $('#drop').classList.add('hot'); }
});
document.addEventListener('dragleave', e => { if (e.target.id === 'drop') e.target.classList.remove('hot'); });
document.addEventListener('drop', e => {
  const ph = e.dataTransfer.getData('text/x-ph'), vid = e.dataTransfer.getData('text/x-vid');
  if (ph && e.target.closest('#strip')) { e.preventDefault(); insertPh(ph, document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null); }
  else if (vid) { const sl = e.target.closest('.slab'); if (!sl) return; e.preventDefault(); const from = S.variants.findIndex(v => v.id === vid), to = S.variants.findIndex(v => v.id === sl.dataset.vid); if (from !== to) { S.variants.splice(to, 0, S.variants.splice(from, 1)[0]); } render(); }
  else if (e.dataTransfer.files.length && e.target.closest('#drop')) { e.preventDefault(); readFiles(e.dataTransfer.files); }
});

if (!location.hash) history.replaceState(null, '', '#/home');
render();
</script>
</body>
</html>
